<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; connect-src 'self' ws: wss: http: https:;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบ POS ค้าของเก่า by.leolung</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>

<style>
/* ---------- tokens ---------- */
:root{
  --bg:#E2E4DF;
  --bg-2:#D7DAD3;
  --surface:#F7F8F5;
  --surface-2:#FFFFFF;
  --ink:#14170F;
  --ink-muted:#454C46;
  --ink-faint:#656C61;
  --item-ink:#1B4B78;
  --border:#C6CBC2;
  --border-strong:#AFB6AA;
  --accent:#BD5B2C;
  --accent-hover:#A34E24;
  --accent-soft:#F1DDCB;
  --accent-ink:#FFFFFF;
  --money:#2F7A4F;
  --money-soft:#E1EFE4;
  --brass:#93711F;
  --brass-soft:#F0E6C8;
  --danger:#B23A2E;
  --danger-soft:#F5DEDA;
  --shadow: 0 1px 2px rgba(20,24,20,.06), 0 4px 14px rgba(20,24,20,.06);
  --radius: 6px;
  --font-display: 'Chakra Petch', 'Leelawadee UI', 'Tahoma', sans-serif;
  --font-body: 'IBM Plex Sans Thai', 'Leelawadee UI', 'Tahoma', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141714;
    --bg-2:#1A1D19;
    --surface:#1C201C;
    --surface-2:#232823;
    --ink:#E8EAE4;
    --ink-muted:#B7BEB4;
    --ink-faint:#8C938A;
    --item-ink:#7CB4EE;
    --border:#333A33;
    --border-strong:#454E44;
    --accent:#E38350;
    --accent-hover:#EE9767;
    --accent-soft:#3A2A1E;
    --accent-ink:#1B140D;
    --money:#5FBE85;
    --money-soft:#173321;
    --brass:#D3B15E;
    --brass-soft:#332B14;
    --danger:#E37A6C;
    --danger-soft:#3B211D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141714;
  --bg-2:#1A1D19;
  --surface:#1C201C;
  --surface-2:#232823;
  --ink:#E8EAE4;
  --ink-muted:#B7BEB4;
  --ink-faint:#8C938A;
  --item-ink:#7CB4EE;
  --border:#333A33;
  --border-strong:#454E44;
  --accent:#E38350;
  --accent-hover:#EE9767;
  --accent-soft:#3A2A1E;
  --accent-ink:#1B140D;
  --money:#5FBE85;
  --money-soft:#173321;
  --brass:#D3B15E;
  --brass-soft:#332B14;
  --danger:#E37A6C;
  --danger-soft:#3B211D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#root{height:100vh;}
::selection{background:var(--accent-soft);}
button{font-family:inherit;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;}

.tabular{font-variant-numeric:tabular-nums;}
.font-display{font-family:var(--font-display);}

h1,h2,h3,h4{text-wrap:balance;font-family:var(--font-display);margin:0;}

.app-shell{
  display:grid;
  grid-template-rows:auto 1fr;
  height:100vh;
  background:
    radial-gradient(1200px 500px at 100% -10%, var(--bg-2), transparent 60%),
    var(--bg);
}
.app-header{position:sticky;top:0;z-index:30;}
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px;
  padding:10px 18px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  -webkit-app-region: drag;
}
.topbar button, .topbar input{ -webkit-app-region: no-drag; }
.sync-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);padding:5px 10px;border-radius:99px;background:var(--bg-2);white-space:nowrap;}
.sync-dot{width:7px;height:7px;border-radius:99px;background:var(--ink-faint);flex:none;}
.sync-dot.on{background:var(--money);box-shadow:0 0 0 3px var(--money-soft);}
.sync-dot.off{background:var(--ink-faint);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:38px;height:38px;border-radius:8px;
  background:linear-gradient(155deg, var(--accent), var(--accent-hover));
  display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
  flex:none;
}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.2px;line-height:1.1;}
.brand-sub{font-size:11.5px;color:var(--ink-muted);letter-spacing:.3px;}
.topbar-spacer{flex:1;}
.topbar-clock{font-size:13px;color:var(--ink-muted);text-align:right;line-height:1.3;}
.topbar-clock b{color:var(--ink);font-family:var(--font-display);font-variant-numeric:tabular-nums;}

.frame{
  display:grid;
  grid-template-columns:290px 1fr 320px;
  min-height:0;
}
.pane{
  min-height:0;
  overflow-y:auto;
  padding:14px;
  display:flex;flex-direction:column;gap:12px;
}
.pane-left{border-right:1px solid var(--border);}
.pane-right{border-left:1px solid var(--border);background:var(--surface);}

@media (max-width:1080px){
  html,body{height:auto;}
  body{overflow-y:auto;overflow-x:hidden;}
  #root{height:auto;min-height:100vh;}
  .app-shell{height:auto;min-height:100vh;}
  .frame{grid-template-columns:1fr;grid-auto-rows:auto;overflow:visible;}
  .pane{max-height:none;overflow:visible;}
  .pane-left{border-right:none;border-bottom:1px solid var(--border);}
  .pane-right{border-left:none;border-top:1px solid var(--border);}
  .topbar{padding:10px 14px;}
  .topbar-clock{text-align:left;}
}

/* ขยายขนาดตัวอักษร/หน้าจอ (ตั้งค่า → ขนาดตัวอักษร): ที่ขนาดปกติ 100% ทั้งแอปถูกออกแบบให้พอดี
   กับความสูงจอ (100vh) เป๊ะ โดยแต่ละพาเนล เลื่อนดูของตัวเองแยกกัน — แต่พอซูมทั้งหน้าใหญ่ขึ้น
   (CSS zoom) เนื้อหาจะใหญ่เกิน 100vh จริง ถ้ายังบังคับ overflow:hidden ไว้จะเลื่อนไปกดเมนูด้านบน
   ไม่ได้เลย จึงสลับมาให้ทั้งหน้าเลื่อนแบบหน้าเว็บปกติแทน (เหมือน breakpoint จอแคบด้านบน) พร้อมปัก
   หัวเมนู (app-header) ให้ลอยค้างด้านบนเสมอ กดเมนูได้ตลอดแม้เลื่อนหน้าอยู่ */
html.ui-scaled,html.ui-scaled body{height:auto;}
html.ui-scaled body{overflow-y:auto;overflow-x:hidden;}
html.ui-scaled #root{height:auto;min-height:100vh;}
html.ui-scaled .app-shell{height:auto;min-height:100vh;}
html.ui-scaled .frame{grid-auto-rows:auto;overflow:visible;}
html.ui-scaled .pane{max-height:none;overflow:visible;}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px;
}
.panel-title{
  font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-muted);margin-bottom:9px;display:flex;align-items:center;gap:6px;
}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:5px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--ink);
  font-size:15px;font-weight:500;padding:9px 14px;cursor:pointer;
  transition:background .12s,border-color .12s,transform .05s;
  line-height:1.2;
}
.btn:hover{background:var(--bg-2);}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn-money{background:var(--money);border-color:var(--money);color:#fff;font-weight:700;}
.btn-money:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--bg-2);}
.btn-danger-ghost{background:transparent;border-color:transparent;color:var(--danger);}
.btn-danger-ghost:hover{background:var(--danger-soft);}
.btn-block{width:100%;}
.btn-sm{padding:5px 9px;font-size:12px;}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:5px;border:1px solid transparent;
  background:transparent;color:var(--ink-muted);cursor:pointer;
}
.icon-btn:hover{background:var(--bg-2);color:var(--ink);}

/* inputs */
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:12.5px;color:var(--ink-muted);font-weight:600;}
.input,.select{
  border:1px solid var(--border-strong);border-radius:5px;background:var(--surface-2);
  color:var(--ink);padding:10px 12px;font-size:16px;width:100%;
}
.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.input-search{padding-left:32px;}
.input-wrap{position:relative;}
.input-wrap .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.input-wrap .search-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);}
.input-wrap .input-search{padding-right:30px;}

/* customer */
.cust-result{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 9px;border-radius:5px;cursor:pointer;border:1px solid transparent;
}
.cust-result:hover{background:var(--bg-2);border-color:var(--border);}
.cust-result-name{font-size:13.5px;font-weight:600;}
.cust-result-meta{font-size:11.5px;color:var(--ink-muted);}
.badge{
  display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.2px;
  padding:2px 7px;border-radius:99px;white-space:nowrap;
}
.badge-retail{background:var(--bg-2);color:var(--ink-muted);}
.badge-cart{background:var(--accent-soft);color:var(--accent-hover);}
.badge-factory{background:var(--brass-soft);color:var(--brass);}

.walkin-chip{
  display:flex;align-items:center;gap:8px;padding:9px;border-radius:5px;
  border:1px dashed var(--border-strong);cursor:pointer;font-size:13px;color:var(--ink-muted);
}
.walkin-chip.active{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.walkin-chip:hover{background:var(--bg-2);}

.active-customer-card{border:1px solid var(--border);border-radius:var(--radius);padding:11px;background:var(--surface-2);}
.ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ac-photo{width:40px;height:50px;object-fit:cover;border-radius:4px;border:1px solid var(--border);flex:0 0 auto;}
.ac-name{font-family:var(--font-display);font-weight:600;font-size:15.5px;}
.ac-phone{font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:4px;margin-top:2px;}
.ac-hist-item{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--border);color:var(--ink-muted);}
.ac-hist-item b{color:var(--ink);font-weight:600;}
.ac-verified{margin-top:7px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--money);}

/* members page */
.members-grid{display:flex;gap:14px;align-items:flex-start;}
.member-list-col{width:300px;flex:0 0 300px;}
.member-detail-col{flex:1;min-width:0;}
@media (max-width:1100px){.members-grid{flex-direction:column;} .member-list-col{width:100%;flex:1 1 auto;}}
.member-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;}
.member-row:hover{background:var(--bg-2);}
.member-row.active{background:var(--accent-soft);border-color:var(--accent);}
.member-row-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
.member-row-meta{font-size:11.5px;color:var(--ink-muted);margin-top:1px;}
.member-photo-lg{width:84px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:0 0 auto;}
.member-photo-ph{width:84px;height:104px;border-radius:8px;border:1px dashed var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);}
.cat-breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--border);font-size:12.5px;}
.cat-breakdown-row:first-child{border-top:none;}

/* held bills (พักบิล) */
.held-bill-row{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--surface-2);}
.held-bill-row:hover{background:var(--bg-2);border-color:var(--accent);}
.held-bill-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.held-bill-meta{font-size:11.5px;color:var(--ink-muted);margin-top:1px;}

/* id card */
.idcard-box{border:1px dashed var(--border-strong);border-radius:5px;padding:10px;background:var(--bg-2);display:flex;flex-direction:column;gap:6px;}
.idcard-status{display:flex;align-items:center;gap:6px;font-size:11.5px;}
.idcard-status.ok{color:var(--money);}
.idcard-status.bad{color:var(--danger);}
.idcard-status.muted{color:var(--ink-faint);}
.result-verified{color:var(--money);flex:none;}

/* mode toggle */
.mode-toggle{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;}
.mode-toggle button{flex:1;padding:8px 6px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:none;cursor:pointer;color:var(--ink-muted);}
.mode-toggle button:not(:last-child){border-right:1px solid var(--border-strong);}
.mode-toggle button.active{background:var(--accent);color:var(--accent-ink);}
.mode-hint{font-size:11px;color:var(--ink-faint);margin-top:5px;}

/* repeat warning */
.repeat-warn{
  margin-top:10px;padding:9px 10px;border-radius:5px;background:var(--brass-soft);color:var(--brass);
  font-size:12px;display:flex;gap:7px;align-items:flex-start;line-height:1.55;
}
.repeat-warn b{color:inherit;}

/* categories */
.cat-grid{display:flex;flex-direction:column;gap:5px;}
.cat-btn{
  display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:5px;
  border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:var(--ink);
  font-size:15px;font-weight:600;
}
.cat-btn:hover{background:var(--bg-2);}
.cat-btn.active{background:var(--accent);color:var(--accent-ink);}
.cat-btn .cat-ico{flex:none;display:flex;color:var(--accent);}
.cat-btn.active .cat-ico{color:var(--accent-ink);}
.cat-btn-all.active .cat-ico{color:var(--accent-ink);}

/* quick select + item grid */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;}
.item-card{
  border:1px solid var(--border);border-radius:5px;background:var(--surface-2);
  padding:9px 10px;cursor:pointer;text-align:left;position:relative;
  display:flex;flex-direction:column;gap:3px;
}
.item-card:hover{border-color:var(--accent);}
.item-card.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent);}
.item-card-code{font-size:10px;font-weight:700;letter-spacing:0.03em;color:var(--ink-faint);}
.item-card-name{font-size:14.5px;font-weight:700;padding-right:16px;color:var(--item-ink);}
.item-name-ink{color:var(--item-ink)!important;font-weight:600;}
.item-card-price{font-size:14px;color:var(--accent);font-weight:700;}
.item-card-price .unit{color:var(--ink-muted);font-weight:400;}
.item-star{position:absolute;top:7px;right:7px;color:var(--ink-faint);}
.item-star.fav{color:var(--brass);}

/* weigh panel */
.weigh-head{display:flex;align-items:center;justify-content:space-between;}
.weigh-item-name{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--item-ink);}
.weigh-item-cat{font-size:11.5px;color:var(--ink-muted);}
.weigh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px;}
@media (max-width:1350px){.weigh-grid{grid-template-columns:repeat(2,1fr);}}
.weigh-net{
  margin-top:10px;display:flex;align-items:center;justify-content:space-between;
  background:var(--bg-2);border-radius:5px;padding:10px 12px;
}
.weigh-net-label{font-size:12px;color:var(--ink-muted);}
.weigh-net-val{font-family:var(--font-display);font-weight:700;font-size:25px;}
.weigh-amt-val{font-family:var(--font-display);font-weight:700;font-size:25px;color:var(--money);}

/* bill table */
.bill-table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow-y:auto;overflow-x:hidden;background:var(--surface-2);}
.bill-table-wrap thead th{position:sticky;top:0;background:var(--surface-2);z-index:1;}
table.bill-table{width:100%;border-collapse:collapse;font-size:14.5px;}
table.bill-table thead th{
  text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);
  padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg-2);font-weight:600;
}
table.bill-table thead th:first-child,table.bill-table tbody td:first-child{text-align:left;}
table.bill-table tbody td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;}
table.bill-table tbody tr:last-child td{border-bottom:none;}
table.bill-table tbody tr:hover{background:var(--bg-2);}
.row-actions{display:flex;gap:3px;justify-content:flex-end;}
.empty-bill{padding:34px 10px;text-align:center;color:var(--ink-faint);font-size:13px;}
.group-row{cursor:pointer;}
.group-name-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;cursor:pointer;color:var(--item-ink);font:inherit;font-weight:700;text-align:left;}
.group-chevron{transition:transform .15s;flex:none;color:var(--ink-faint);}
.group-chevron.open{transform:rotate(90deg);}
.round-badge{font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:99px;}
table.bill-table tr.sub-row td{background:var(--bg-2);}
table.bill-table tr.sub-row .sub-label{padding-left:27px;color:var(--ink-muted);font-size:12px;}
table.bill-table tr.sub-row.editing td{background:var(--accent-soft);}

/* right summary */
.summary-total{
  background:linear-gradient(160deg, var(--surface-2), var(--surface));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:center;
}
.summary-total-label{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-muted);font-weight:600;}
.summary-total-val{font-family:var(--font-display);font-weight:700;font-size:44px;color:var(--money);line-height:1.15;margin-top:4px;}
.summary-total-sub{font-size:12px;color:var(--ink-muted);margin-top:6px;display:flex;justify-content:center;gap:14px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--border);}
.summary-row:first-child{border-top:none;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,17,14,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:90vh;display:flex;flex-direction:column;}
.modal-card.wide{max-width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

.settings-cat-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);font-weight:700;margin:10px 0 5px;}
.settings-row{display:grid;grid-template-columns:1.6fr 90px 90px 60px 34px 34px;gap:8px;align-items:center;padding:6px 0;}
.settings-header{display:grid;grid-template-columns:1.6fr 90px 90px 60px 34px 34px;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-faint);padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:3px;font-weight:700;}
.settings-header span:not(:first-child){text-align:center;}
.settings-header-code,.settings-row-code{grid-template-columns:88px 1.6fr 90px 90px 60px 34px 34px;}
.settings-row .sname{font-size:13px;}
.settings-row .sunit{font-size:11px;color:var(--ink-muted);text-align:center;}

/* update banner */
.update-banner{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--accent);color:var(--accent-ink);
  padding:10px 18px;font-size:13.5px;box-shadow:var(--shadow);
}
.update-banner span{flex:1;min-width:220px;}
.update-banner .btn-primary{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);}
.update-banner .icon-btn{color:var(--accent-ink);}

/* toast */
.toast-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:80;}
.toast{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  box-shadow:var(--shadow);border-radius:6px;padding:9px 14px;font-size:13px;color:var(--ink);
  animation:toastin .15s ease-out;
}
.toast.ok{border-color:var(--money);color:var(--money);}
.toast.err{border-color:var(--danger);color:var(--danger);}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* receipt — IBM Plex Sans Thai สำหรับข้อความ/ชื่อสินค้า (อ่านภาษาไทยชัด), Chakra Petch
   สำหรับตัวเลข/ราคา (ทรงตัวเลขคมชัดกว่า เหมาะกับเครื่องพิมพ์ความร้อน) */
.receipt{
  --r-scale:1;
  box-sizing:border-box;background:#fff;color:#000;width:80mm;max-width:80mm;margin:0 auto;padding:6px 0;
  font-family:'IBM Plex Sans Thai',sans-serif;font-size:calc(19px * var(--r-scale));font-weight:700;line-height:1.38;overflow:hidden;
}
.receipt *{box-sizing:border-box;font-weight:700;}
.receipt hr{border:none;border-top:1.5px dashed #666;margin:6px 0;}
.receipt .r-shop{text-align:center;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:calc(28px * var(--r-scale));letter-spacing:.2px;}
.receipt .r-sub{text-align:center;font-family:'Chakra Petch',sans-serif;font-size:calc(15px * var(--r-scale));color:#000;}
.receipt .r-customer{text-align:center;font-size:calc(21px * var(--r-scale));margin-top:3px;}
.receipt .r-meta{text-align:center;font-family:'IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums;font-size:calc(17px * var(--r-scale));color:#000;margin-top:2px;}
.receipt table{width:100%;max-width:100%;border-collapse:collapse;table-layout:fixed;font-size:calc(17px * var(--r-scale));margin-top:4px;}
.receipt th{text-align:center;font-family:'Chakra Petch',sans-serif;padding-bottom:4px;border-bottom:2px solid #000;overflow-wrap:break-word;}
.receipt th:first-child, .receipt td:first-child{text-align:center;overflow-wrap:break-word;}
.receipt th:first-child{font-family:'IBM Plex Sans Thai',sans-serif;}
.receipt td{padding:6px 0;text-align:right;vertical-align:top;overflow-wrap:break-word;font-family:'IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums;}
.receipt td:first-child{font-family:'IBM Plex Sans Thai',sans-serif;text-align:center;}
.receipt .r-total{display:flex;justify-content:space-between;font-family:'IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums;font-size:calc(28px * var(--r-scale));margin-top:6px;}
.receipt .r-line{display:flex;justify-content:space-between;font-size:calc(17px * var(--r-scale));}
.receipt .r-line b{font-family:'IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums;}
.receipt .r-foot{text-align:center;margin-top:10px;font-size:calc(15px * var(--r-scale));color:#000;}

@media print{
  body *{visibility:hidden;}
  #receipt-print,#receipt-print *{visibility:visible;}
  /* จัดกึ่งกลางไว้ เว้นระยะขอบเล็กน้อย (~1mm ต่อข้าง) เพราะทดสอบแล้วที่กระดาษเต็มความกว้าง
     ขอบขวาโดนตัดถ้าตัวหนังสือใหญ่ๆ (ยอดเงินหลักพัน) — ความกว้างจริงถูกกำหนดแบบไดนามิกผ่าน
     inline style ของ #receipt-print (ดู ReceiptModal → printWidthMm) แยกกันระหว่างจุดพิมพ์
     "จบการขาย" กับ "พิมพ์ซ้ำจากประวัติ" ค่าด้านล่างนี้เป็นแค่ค่าเริ่มต้นสำรอง */
  #receipt-print{position:fixed;top:0;left:50%;transform:translateX(-50%);width:78mm;}
  @page{size:80mm auto;margin:0;}
}
[hidden]{display:none!important;}

/* ---------- page nav ---------- */
.page-nav{display:flex;gap:4px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);}
@media (max-width:1080px){.page-nav{padding:0 14px;overflow-x:auto;}}
.page-tab{
  display:flex;align-items:center;gap:8px;padding:12px 16px;border:none;background:none;cursor:pointer;
  font-size:14.5px;font-weight:600;color:var(--ink-muted);border-bottom:3px solid transparent;white-space:nowrap;
}
.page-tab:hover{color:var(--ink);background:var(--bg-2);}
.page-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.page-body{height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
@media (max-width:1080px){.page-body{height:auto;overflow:visible;}}
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.page-title{font-family:var(--font-display);font-weight:700;font-size:22px;}
.page-sub{font-size:13.5px;color:var(--ink-muted);margin-top:2px;}

/* ---------- numpad ---------- */
.numpad{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;}
.numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.numpad-btn{
  padding:14px 0;border-radius:6px;border:1px solid var(--border-strong);background:var(--bg-2);
  color:var(--ink);font-family:var(--font-display);font-size:19px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.numpad-btn:hover{background:var(--accent-soft);border-color:var(--accent);}
.numpad-btn:active{transform:translateY(1px);}
.numpad-clear{width:100%;margin-top:7px;padding:11px 0;border-radius:6px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);font-weight:700;font-size:14px;cursor:pointer;}
.numpad-confirm{width:100%;margin-top:7px;}

/* ---------- inventory / history / settings pages ---------- */
.data-table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--surface-2);}
table.data-table{width:100%;border-collapse:collapse;font-size:14.5px;}
table.data-table thead th{
  text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-muted);
  padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg-2);font-weight:700;white-space:nowrap;
}
table.data-table tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data-table tbody tr:last-child td{border-bottom:none;}
table.data-table tbody tr:hover{background:var(--bg-2);}
.inline-input{border:1px solid var(--border-strong);border-radius:5px;background:var(--surface-2);color:var(--ink);padding:6px 8px;font-size:14px;width:100%;}
.inline-input:focus{outline:2px solid var(--accent);outline-offset:-1px;}

.stat-row{display:flex;gap:12px;flex-wrap:wrap;}
.stat-tile{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.stat-tile-label{font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.stat-tile-val{font-family:var(--font-display);font-weight:700;font-size:26px;margin-top:4px;}

.drive-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;}
.drive-status-row{display:flex;align-items:center;gap:10px;}
.drive-dot{width:10px;height:10px;border-radius:99px;background:var(--ink-faint);flex:none;}
.drive-dot.on{background:var(--money);box-shadow:0 0 0 4px var(--money-soft);}
.setup-steps{font-size:13.5px;color:var(--ink-muted);line-height:1.9;background:var(--bg-2);border-radius:5px;padding:12px 16px;}
.setup-steps b{color:var(--ink);}
.setup-steps a{color:var(--accent);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef,useCallback} = React;

const hasDesktop = typeof window !== "undefined" && !!window.scrapAPI;

/* ============================= ICONS ============================= */
function Ico({children,size=18,strokeWidth=2,className=""}){
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}

      {children}

}
const Icon = ({name, ...p}) => {
  switch(name){
    case "search": return <Ico {...p}><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></Ico>;
    case "userPlus": return <Ico {...p}><circle cx="9" cy="7.5" r="3.8"/><path d="M2.5 20.5v-1.2a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1.2"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></Ico>;

    case "plus": return <Ico {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Ico>;
    case "trash": return <Ico {...p}><path d="M4 7h16"/><path d="M9 7V4.6A1.6 1.6 0 0 1 10.6 3h2.8A1.6 1.6 0 0 1 15 4.6V7"/><path d="M6.5 7l1 12.4A2 2 0 0 0 9.5 21h5a2 2 0 0 0 2-1.6L17.5 7"/><line x1="10.5" y1="11" x2="10.5" y2="17"/><line x1="13.5" y1="11" x2="13.5" y2="17"/></Ico>;
    case "pencil": return <Ico {...p}><path d="M12.5 19.5H21"/><path d="M16 4.5a2 2 0 0 1 2.8 2.8L7.5 18.6l-4 1 1-4Z"/></Ico>;

    case "star": return <Ico {...p}><path d="M12 2.5l2.95 6.32 6.55.68-4.9 4.66 1.36 6.66L12 17.65l-5.96 3.17 1.36-6.66-4.9-4.66 6.55-.68Z"/></Ico>;

    case "settings": {
      const lines = Array.from({length:8}).map((_,i)=>{
        const a = (i*45)*Math.PI/180;
        const x1 = 12+Math.cos(a)*7.4, y1=12+Math.sin(a)*7.4;

    case "scale": return <Ico {...p}><line x1="12" y1="3" x2="12" y2="21"/><path d="M4 21h16"/><path d="M4 7h16"/><path d="M4 7l-2.2 5.2a2.6 2.6 0 0 0 4.9 0Z"/><path d="M20 7l-2.2 5.2a2.6 2.6 0 0 0 4.9 0Z"/></Ico>;
    case "package": return <Ico {...p}><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><line x1="12" y1="12" x2="12" y2="21"/></Ico>;
    case "fileText": return <Ico {...p}><path d="M6.5 2.5h7l4 4v15h-11Z"/><line x1="9" y1="9.2" x2="11.5" y2="9.2"/><line x1="9" y1="13" x2="14.5" y2="13"/><line x1="9" y1="16.5" x2="14.5" y2="16.5"/></Ico>;
    case "bottle": return <Ico {...p}><path d="M9.3 2.5h5.4v3.4l1.9 3v11.6a1.3 1.3 0 0 1-1.3 1.3H8.7a1.3 1.3 0 0 1-1.3-1.3V8.9l1.9-3Z"/><line x1="9.3" y1="2.5" x2="9.3" y2="5.9"/><line x1="14.7" y1="2.5" x2="14.7" y2="5.9"/><line x1="8" y1="12" x2="16" y2="12"/></Ico>;
    case "gem": return <Ico {...p}><path d="M4 9 8.5 3h7L20 9l-8 12Z"/><path d="M4 9h16"/><path d="M8.5 3 12 9l-2.5 12"/><path d="M15.5 3 12 9l2.5 12"/></Ico>;
    case "cup": return <Ico {...p}><path d="M7.5 2.5h9l-1.2 9.4a3.3 3.3 0 0 1-6.6 0Z"/><line x1="12" y1="12.6" x2="12" y2="18"/><line x1="8" y1="21" x2="16" y2="21"/></Ico>;
    case "magnet": return <Ico {...p}><path d="M6 15V10a6 6 0 0 1 12 0v5"/><path d="M6 15h4v4.5a2 2 0 0 1-4 0Z"/><path d="M14 15h4v4.5a2 2 0 0 1-4 0Z"/></Ico>;
    case "check": return <Ico {...p}><polyline points="20 6 9 17 4 12"/></Ico>;
    case "alert": return <Ico {...p}><path d="M10.3 3.8 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/><line x1="12" y1="9.3" x2="12" y2="13.3"/><line x1="12" y1="16.6" x2="12" y2="16.7"/></Ico>;
    case "history": return <Ico {...p}><path d="M3.5 12a8.5 8.5 0 1 0 2.7-6.2"/><polyline points="3 3.5 3.5 7.8 8 7.3"/><polyline points="12 8 12 12.5 15.5 14.3"/></Ico>;

    case "shieldCheck": return <Ico {...p}><path d="M12 2.5 20 5.5v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10v-6Z"/><polyline points="8.4 12.2 11 14.8 15.6 9.7"/></Ico>;
    case "hardDrive": return <Ico {...p}><line x1="2.5" y1="13" x2="21.5" y2="13"/><rect x="2.5" y="4" width="19" height="16" rx="2"/><line x1="6.5" y1="17" x2="6.51" y2="17"/><line x1="10.5" y1="17" x2="10.51" y2="17"/></Ico>;
    case "smartphone": return <Ico {...p}><rect x="6" y="2.5" width="12" height="19" rx="2.2"/><line x1="10.5" y1="18.3" x2="13.5" y2="18.3"/></Ico>;
    case "cloud": return <Ico {...p}><path d="M7 18.5a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 18 8.6 4.5 4.5 0 0 1 17 18.5H7Z"/></Ico>;
    case "refresh": return <Ico {...p}><path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1"/><polyline points="18 2.5 18 6.5 14 6.5"/><path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1"/><polyline points="6 21.5 6 17.5 10 17.5"/></Ico>;
    case "unlink": return <Ico {...p}><path d="M9 15 15 9"/><path d="M10.5 5.5 12 4a3.5 3.5 0 0 1 5 5l-1.5 1.5"/><path d="M13.5 18.5 12 20a3.5 3.5 0 0 1-5-5l1.5-1.5"/><line x1="3" y1="3" x2="21" y2="21"/></Ico>;

    case "folder": return <Ico {...p}><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5h8.5A1.5 1.5 0 0 1 20.5 9v8a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 17Z"/></Ico>;
    case "zap": return <Ico {...p}><polygon points="12.5 2.5 4 14 11 14 10.5 21.5 19.5 10 12.5 10"/></Ico>;
    case "layers": return <Ico {...p}><polygon points="12 3 21 8 12 13 3 8"/><polyline points="3 13 12 18 21 13"/><polyline points="3 17.5 12 22.5 21 17.5"/></Ico>;

    case "wallet": return <Ico {...p}><path d="M3 7.5a2 2 0 0 1 2-2h13a1.5 1.5 0 0 1 1.5 1.5V9"/><path d="M3 7.5V18a2 2 0 0 0 2 2h14a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 19 9H6a2 2 0 0 1-2-2Z"/><circle cx="16.5" cy="14" r="1.4"/></Ico>;

};

/* ============================= DATA ============================= */
const LS_KEY = "scrap_pos_data_v1";

function loadInitialData(){
  if(hasDesktop){
    try{ return window.scrapAPI.loadDataSync() || null; }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function persistData(data){
  if(hasDesktop){
    window.scrapAPI.saveData(data).catch(()=>{});
  } else {
    try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  }
}

function isValidThaiID(id){
  if(!/^[0-9]{13}$/.test(id)) return false;
  let sum = 0;
  for(let i=0;i<12;i++) sum += Number(id.charAt(i)) * (13-i);
  const check = (11 - (sum % 11)) % 10;
  return check === Number(id.charAt(12));
}
function maskThaiID(id){
  const c = (id||"").replace(/\D/g,"");
  if(c.length<13) return c;
  return `${c[0]}-XXXX-XXXXX-XX-${c[12]}`;
}

function filterDecimalInput(v){
  let s = String(v).replace(/[^0-9.]/g, "");
  const firstDot = s.indexOf(".");
  if(firstDot !== -1) s = s.slice(0, firstDot+1) + s.slice(firstDot+1).replace(/\./g, "");
  return s;
}

function fmtMonthLabel(monthKey){
  if(!monthKey) return "";
  const [y,m] = monthKey.split("-").map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString("th-TH",{month:"long",year:"numeric"});

function financeSummaryFor(monthKey, {bills, extraIncome, advances}){
  const scrapPurchases = bills.filter(b=>monthKeyOf(b.date)===monthKey).reduce((s,b)=>s+billStats(b).amount,0);
  const incomeTotal = extraIncome.filter(i=>monthKeyOf(i.date)===monthKey).reduce((s,i)=>s+i.amount,0);
  const advanceTotal = advances.filter(a=>monthKeyOf(a.date)===monthKey).reduce((s,a)=>s+a.amount,0);
  return { scrapPurchases, incomeTotal, advanceTotal, net: incomeTotal - advanceTotal };
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("th-TH",{day:"2-digit",month:"2-digit",year:"2-digit"}) + " " +
         d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
}
function fmtDateOnlyTH(dateStr){
  // dateStr เป็น "YYYY-MM-DD" ธรรมดา (จาก <input type="date">) ไม่ใช่ ISO datetime
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("th-TH",{day:"2-digit",month:"2-digit",year:"2-digit"});
}

function billStats(bill){
  let weight=0, amount=0;
  bill.items.forEach(it=>{ if(it.mode==="weight") weight+=it.net; amount+=it.amount; });
  return {weight, amount};
}
function customerStats(customerId, bills){
  const mine = bills.filter(b=>b.customerId===customerId);
  let spent=0;
  mine.forEach(b=>{ spent+=billStats(b).amount; });
  return { visits:mine.length, spent, bills: mine.slice().sort((a,b)=>b.date.localeCompare(a.date)) };
}

/* ============================= TOASTS ============================= */
function useToasts(){
  const [toasts,setToasts] = useState([]);
  const push = useCallback((message,type="ok")=>{
    const id = uid();
    setToasts(t=>[...t,{id,message,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2800);
  },[]);
  return {toasts, push};
}

        retryTimer = setTimeout(connect, 2000);
      };
      socket.onerror = ()=>{ socket.close(); };
    }
    connect();
    return ()=>{ alive=false; clearTimeout(retryTimer); if(wsRef.current) wsRef.current.close(); };
  },[]);

  function wsSend(msg){
    const s = wsRef.current;
    if(s && s.readyState===1){ s.send(JSON.stringify(msg)); return true; }
    return false;
  }

  // ราคาโหมด: สลับอัตโนมัติตามลูกค้าที่เลือก (สมาชิก = ประจำ, ไม่เลือก = จร) แต่ปรับมือได้ภายหลัง
  useEffect(()=>{
    setPriceMode(selectedCustomerId ? "regular" : "casual");
  },[selectedCustomerId]);

  // เครื่องอ่านบัตรประชาชน: เสียบบัตรแล้วถ้าเป็นสมาชิกเดิม จะเลือกให้อัตโนมัติ
  // ถ้ายังไม่เคยเป็นสมาชิก จะเปิดฟอร์มเพิ่มสมาชิกใหม่พร้อมกรอกข้อมูล/รูปจากบัตรให้
  useEffect(()=>{
    if(!hasDesktop || !window.scrapAPI.onCardReaderEvent) return;
    const unsubscribe = window.scrapAPI.onCardReaderEvent((msg)=>{
      if(msg.type!=="card_data" || !msg.data) return;
      const cid = (msg.data.cid||"").trim();
      if(!cid) return;
      const cardInfo = {
        englishName: msg.data.englishName || "",
        birthDateIso: msg.data.birthDateIso || "",
        gender: msg.data.gender || "",
        address: msg.data.address || "",
        issueDateIso: msg.data.issueDateIso || "",
        expireDateIso: msg.data.expireDateIso || "",
      };
      const newPhoto = msg.data.photoBase64Jpeg ? `data:image/jpeg;base64,${msg.data.photoBase64Jpeg}` : "";
      const existing = customers.find(c=>c.idCard===cid);
      if(existing){
        setSelectedCustomerId(existing.id);
        const changed = (newPhoto && newPhoto!==existing.photo) || JSON.stringify(cardInfo)!==JSON.stringify(existing.cardInfo||{});
        if(changed){
          const updated = {...existing, photo:newPhoto||existing.photo, idVerified:true, cardInfo};
          setCustomers(list=>list.map(c=>c.id===existing.id?updated:c));
          wsSend({type:"addCustomer", customer:updated});
        }
        push(`ตรวจพบบัตรประชาชน — เลือกสมาชิก "${existing.name}" ให้อัตโนมัติ`,"ok");
      } else {
        setCardPrefill({
          name: msg.data.thaiName || "",
          idCard: cid,
          photo: newPhoto,
          cardInfo,
        });
        setShowAddCustomer(true);
        push("ตรวจพบบัตรประชาชนใบใหม่ — กรอกเบอร์โทรแล้วบันทึกเป็นสมาชิกได้เลย","ok");
      }
    });
    return unsubscribe;
  },[customers]);

  const selectedCustomer = customers.find(c=>c.id===selectedCustomerId) || null;
  const activeItem = catalog.find(i=>i.id===activeItemId) || null;

  const visibleItems = useMemo(()=>{
    const q = itemSearch.trim().toLowerCase();
    if(q){
      return catalog.filter(i => i.name.toLowerCase().includes(q) || (i.code||"").toLowerCase().includes(q));
    }
    return selectedCategory==="all" ? catalog : catalog.filter(i=>i.category===selectedCategory);
  },[catalog, selectedCategory, itemSearch]);
  const quickItems = useMemo(()=>catalog.filter(i=>i.quick),[catalog]);

  const searchResults = useMemo(()=>{
    const q = search.trim().toLowerCase();
    if(!q) return [];
    return customers.filter(c=> c.name.toLowerCase().includes(q) || c.phone.includes(q)
      || (c.nickname||"").toLowerCase().includes(q) || (c.licensePlate||"").toLowerCase().includes(q)).slice(0,8);
  },[search, customers]);

  function pickItem(item){
    setEditingId(null);
    setActiveItemId(item.id);
    setPriceOverride(String(priceOf(item, priceMode)));
    setGross(""); setTare("0"); setDeductPct("0"); setQty("");
  }

  const netWeight = useMemo(()=>{
    if(!activeItem || activeItem.mode!=="weight") return 0;
    const g = parseFloat(gross)||0, t = parseFloat(tare)||0, d = parseFloat(deductPct)||0;
    let n = Math.max(0, g - t);
    n = n * (1 - Math.min(100,Math.max(0,d))/100);
    return Math.max(0, n);
  },[activeItem, gross, tare, deductPct]);

  const lineAmount = useMemo(()=>{
    if(!activeItem) return 0;
    const p = parseFloat(priceOverride)||0;
    if(activeItem.mode==="weight") return netWeight*p;
    return (parseFloat(qty)||0)*p;
  },[activeItem, priceOverride, netWeight, qty]);

  function resetWeighForm(){
    setEditingId(null); setActiveItemId(null);
    setGross(""); setTare("0"); setDeductPct("0"); setQty(""); setPriceOverride("");
  }

  function addLine(){
    if(!activeItem) return;
    const p = parseFloat(priceOverride)||0;
    let newLine;
    if(activeItem.mode==="weight"){
      if(netWeight<=0){ push("กรอกน้ำหนักให้ถูกต้องก่อนเพิ่มรายการ","err"); return; }
      newLine = {
        id: editingId || uid(), itemId:activeItem.id, name:activeItem.name, category:activeItem.category,
        mode:"weight", unit:activeItem.unit, gross:parseFloat(gross)||0, tare:parseFloat(tare)||0,
        deductPct:parseFloat(deductPct)||0, net:netWeight, price:p, amount:netWeight*p, priceMode,
      };
    } else {
      const q = parseFloat(qty)||0;
      if(q<=0){ push("กรอกจำนวนให้ถูกต้องก่อนเพิ่มรายการ","err"); return; }
      newLine = {
        id: editingId || uid(), itemId:activeItem.id, name:activeItem.name, category:activeItem.category,
        mode:"unit", unit:activeItem.unit, qty:q, price:p, amount:q*p, priceMode,
      };
    }
    if(editingId){
      setBillItems(list=>list.map(l=> l.id===editingId ? newLine : l));
      push("บันทึกการแก้ไขรอบนี้แล้ว","ok");
    } else {
      setBillItems(list=>[...list, newLine]);
    }
    resetWeighForm();
  }

  // แก้ไขแบบไม่ทำลายข้อมูล: ยังไม่ลบรายการเดิมออกจนกว่าจะกด "บันทึกการแก้ไข" —
  // กันข้อมูลหายถ้าเผลอกดแก้ไขรอบอื่นก่อนบันทึกรอบที่กำลังแก้อยู่
  function editLine(line){
    setEditingId(line.id);
    setActiveItemId(line.itemId);
    setPriceOverride(String(line.price));
    if(line.mode==="weight"){ setGross(String(line.gross)); setTare(String(line.tare)); setDeductPct(String(line.deductPct)); setQty(""); }
    else { setQty(String(line.qty)); setGross(""); setTare("0"); setDeductPct("0"); }
  }
  function removeLine(id){
    setBillItems(list=>list.filter(l=>l.id!==id));
    if(editingId===id) resetWeighForm();
  }

  const totals = useMemo(()=>{
    let weight=0, amount=0;
    billItems.forEach(l=>{ if(l.mode==="weight") weight+=l.net; amount+=l.amount; });
    return {weight, amount, count:billItems.length};
  },[billItems]);

  function clearBill(){
    if(billItems.length===0) return;
    if(!window.confirm("ล้างรายการที่กำลังชั่งทั้งหมดใช่หรือไม่?")) return;
    setBillItems([]); setActiveItemId(null);
  }

  // พักบิล: เก็บรายการที่กำลังชั่งของลูกค้าคนปัจจุบันไว้ก่อน แล้วเปิดบิลว่างให้ลูกค้าคนถัดไป
  // โดยไม่ทำรายการที่ชั่งค้างไว้หาย — กดดึงกลับมาทำต่อได้ภายหลัง
  function parkBill(){
    if(billItems.length===0){ push("ยังไม่มีรายการที่จะพักบิล","err"); return; }
    const held = {
      id: uid(),
      customerId: selectedCustomerId,
      customerName: selectedCustomer ? selectedCustomer.name : "ลูกค้าทั่วไป",
      walkInNickname: selectedCustomer ? "" : walkInNickname,
      walkInLicensePlate: selectedCustomer ? "" : walkInLicensePlate,
      items: billItems,
      priceMode,
      createdAt: new Date().toISOString(),
    };
    setHeldBills(list=>[...list, held]);
    setBillItems([]);
    setSelectedCustomerId(null);
    setActiveItemId(null);
    setWalkInNickname("");
    setWalkInLicensePlate("");
    resetWeighForm();
    push(`พักบิลของ "${held.customerName}" ไว้แล้ว (${held.items.length} รายการ)`,"ok");
  }

  function resumeHeldBill(id){
    const held = heldBills.find(h=>h.id===id);
    if(!held) return;
    if(billItems.length>0){
      if(!window.confirm("มีรายการที่กำลังชั่งอยู่ตอนนี้ — ต้องการพักบิลปัจจุบันไว้ก่อน แล้วดึงบิลที่เลือกมาแทนใช่หรือไม่?")) return;
      const currentHeld = {
        id: uid(),
        customerId: selectedCustomerId,
        customerName: selectedCustomer ? selectedCustomer.name : "ลูกค้าทั่วไป",
        walkInNickname: selectedCustomer ? "" : walkInNickname,
        walkInLicensePlate: selectedCustomer ? "" : walkInLicensePlate,
        items: billItems,
        priceMode,
        createdAt: new Date().toISOString(),
      };
      setHeldBills(list=>[...list.filter(h=>h.id!==id), currentHeld]);
    } else {
      setHeldBills(list=>list.filter(h=>h.id!==id));
    }
    setBillItems(held.items);
    setSelectedCustomerId(held.customerId);
    setPriceMode(held.priceMode || "casual");
    setActiveItemId(null);
    setWalkInNickname(held.walkInNickname || "");
    setWalkInLicensePlate(held.walkInLicensePlate || "");
    resetWeighForm();
    push(`ดึงบิลของ "${held.customerName}" กลับมาทำต่อแล้ว`,"ok");
  }

  function deleteHeldBill(id){

    if(!held) return;
    if(!window.confirm(`ยกเลิกบิลที่พักไว้ของ "${held.customerName}" ใช่หรือไม่? (${held.items.length} รายการจะหายไป)`)) return;

  }

  function finishSale(){
    if(billItems.length===0){ push("ยังไม่มีรายการชั่งในบิลนี้","err"); return; }
    const bill = {
      id: uid(),
      no: bills.length+1,
      date: new Date().toISOString(),
      customerId: selectedCustomer ? selectedCustomer.id : null,
      customerName: selectedCustomer ? selectedCustomer.name : "ลูกค้าทั่วไป",
      customerPhone: selectedCustomer ? selectedCustomer.phone : "",
      customerType: selectedCustomer ? selectedCustomer.type : null,
      customerNickname: selectedCustomer ? (selectedCustomer.nickname||"") : walkInNickname.trim(),
      customerLicensePlate: selectedCustomer ? (selectedCustomer.licensePlate||"") : walkInLicensePlate.trim(),
      items: billItems,
    };

    setWalkInNickname("");

  }

  function addCustomer(data){
    const c = {
      id:uid(), name:data.name.trim(), nickname:(data.nickname||"").trim(), licensePlate:(data.licensePlate||"").trim(),
      phone:data.phone.trim(), type:data.type,
      idCard:data.idCard||"", idVerified:!!data.idVerified, photo:data.photo||"",
      cardInfo:data.cardInfo||null, createdAt:new Date().toISOString(),
    };
    setCustomers(list=>[c,...list]);
    wsSend({type:"addCustomer", customer:c});
    setSelectedCustomerId(c.id);
    setSearch("");
    setShowAddCustomer(false);
    setCardPrefill(null);
    push(`เพิ่มสมาชิก "${c.name}" เรียบร้อย${data.idVerified?" · ยืนยันตัวตนด้วยบัตรประชาชนแล้ว":""}`,"ok");
  }

  function updateCustomer(id, data){
    setCustomers(list=>{
      const next = list.map(c=>c.id===id ? {
        ...c, name:data.name.trim(), nickname:(data.nickname||"").trim(), licensePlate:(data.licensePlate||"").trim(),
        phone:data.phone.trim(), type:data.type,
        idCard:data.idCard||"", idVerified:!!data.idVerified, photo:data.photo||c.photo,
        cardInfo:data.cardInfo||c.cardInfo||null,
      } : c);
      const updated = next.find(c=>c.id===id);
      if(updated) wsSend({type:"addCustomer", customer:updated});
      return next;

    if(selectedCustomerId===id) setSelectedCustomerId(null);

  function updateCatalogPrice(id, field, value){

      return updated;
    }));

      priceRegular:data.priceRegular, priceCasual:data.priceCasual, quick:false,

      wsSend({type:"updateCatalogItem", item:updated});
      return updated;

      if(i.id!==id) return i;

      wsSend({type:"updateCatalogItem", item:updated});
      return updated;
    }));

  function deleteCatalogItem(id){
    const item = catalog.find(i=>i.id===id);

    setCatalog(list=>list.filter(i=>i.id!==id));

  function deleteBill(id){

    if(!bill) return;
    if(!window.confirm(`ยกเลิกบิล #${bill.no} ใช่หรือไม่? การลบนี้ย้อนกลับไม่ได้`)) return;
    setBills(list=>list.filter(b=>b.id!==id));
    wsSend({type:"deleteBill", id});
    push(`ยกเลิกบิล #${bill.no} แล้ว`,"ok");

  // แก้ไขบิลที่บันทึกไปแล้ว (เช่น กรอกน้ำหนัก/ราคาผิด) — แก้ได้เฉพาะรายการสินค้าในบิล
  // ลูกค้า/วันที่เดิมคงไว้ตามเดิม เพื่อไม่ให้กระทบประวัติ/สถิติของสมาชิกผิดเพี้ยน
  function updateBill(id, newItems){

      const next = list.map(b=>b.id===id ? {...b, items:newItems} : b);
      const updated = next.find(b=>b.id===id);

      return next;

    push("บันทึกการแก้ไขบิลแล้ว","ok");

    setSettings(s=>{
      const updated = {...s, ...patch};
      wsSend({type:"updateSettings", settings:updated});
      return updated;
    });
  }

    wsSend({type:"updateCategory", category:cat});

    setCategories(list=>list.filter(c=>c.id!==id));
    wsSend({type:"deleteCategory", id});
    push(`ลบหมวดหมู่ "${cat.label}" แล้ว`,"ok");
  }

  // บันทึกรายรับเสริม 1 บิล อาจมีได้หลายรายการ (เช่น ขายขวดน้ำ + ถุงพลาสติก ในบิลเดียวกัน)
  function addIncome(data){
    const lineItems = data.items.map(it=>({ id:uid(), description:it.description.trim(), amount:it.amount }));
    const amount = lineItems.reduce((s,it)=>s+it.amount,0);
    const item = { id:uid(), no: extraIncome.length+1, date:data.date, items:lineItems, amount, createdAt:new Date().toISOString() };

    wsSend({type:"addIncome", item});
    push(`บันทึกรายรับ ${lineItems.length} รายการ (${money(amount)} ฿) แล้ว`,"ok");

  function deleteIncome(id){
    if(!window.confirm("ลบรายการรายรับนี้ใช่หรือไม่?")) return;
    setExtraIncome(list=>list.filter(i=>i.id!==id));
    wsSend({type:"deleteIncome", id});

  // ออกใบเสร็จให้รายการรายรับเสริม (เช่น ขายขวดน้ำ/เศษของเหลือ) — ใช้ ReceiptModal ตัวเดียวกับ
  // ใบเสร็จซื้อของเก่า โดยสร้าง "บิล" จำลองที่มีรายการย่อยตามที่บันทึกไว้ (รองรับหลายรายการในบิลเดียว)
  // รองรับข้อมูลเก่าที่ยังเป็นแบบ description/amount เดี่ยว (ก่อนมีฟีเจอร์หลายรายการ) ด้วย
  function issueIncomeReceipt(item){

    setEmployees(list=>list.map(e=>{
      if(e.id!==id) return e;
      const updated = {...e, ...patch};
      wsSend({type:"updateEmployee", employee:updated});
      return updated;

  function deleteEmployee(id){
    const emp = employees.find(e=>e.id===id);

    if(!window.confirm(`ลบพนักงาน "${emp.name}" ใช่หรือไม่? (ประวัติเบิกเงินเดิมจะยังอยู่)`)) return;

  function addAdvance(data){
    const emp = employees.find(e=>e.id===data.employeeId);
    const item = {
      id:uid(), employeeId:data.employeeId, employeeName: emp ? emp.name : "ไม่ทราบชื่อ",
      date:data.date, amount:data.amount, note:data.note.trim(), createdAt:new Date().toISOString(),
    };
    setAdvances(list=>[item, ...list]);
    wsSend({type:"addAdvance", item});
    push(`บันทึกเบิกเงิน ${money(item.amount)} ฿ ให้ "${item.employeeName}" แล้ว`,"ok");
  }
  function deleteAdvance(id){
    if(!window.confirm("ลบรายการเบิกเงินนี้ใช่หรือไม่?")) return;
    setAdvances(list=>list.filter(a=>a.id!==id));
    wsSend({type:"deleteAdvance", id});
  }
  function updateAdvance(id, patch){
    setAdvances(list=>{
      const next = list.map(a=>a.id===id ? {...a, ...patch} : a);
      const updated = next.find(a=>a.id===id);
      if(updated) wsSend({type:"addAdvance", item:updated});
      return next;
    });
  }

  async function exportCSV(scope){
    const targetBills = scope==="today" ? bills.filter(b=>b.date.slice(0,10)===todayKey()) : bills;
    if(targetBills.length===0){ push(scope==="today" ? "ยังไม่มีบิลของวันนี้ให้ส่งออก" : "ยังไม่มีประวัติบิลให้ส่งออก","err"); return; }
    const rows = [["เลขที่บิล","วันที่เวลา","ลูกค้า","ประเภทลูกค้า","สินค้า","น้ำหนัก/จำนวน","หน่วย","ประเภทราคา","ราคาต่อหน่วย","จำนวนเงิน(บาท)"]];
    targetBills.forEach(b=>{
      b.items.forEach(it=>{
        rows.push([
          b.no, fmtDateTime(b.date), b.customerName, b.customerType?typeMeta(b.customerType).label:"ทั่วไป",
          it.name, it.mode==="weight"?it.net.toFixed(2):it.qty, it.unit,
          it.priceMode==="regular"?"ประจำ":"จร", it.price.toFixed(2), it.amount.toFixed(2)
        ]);
      });
    });
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    const filename = scope==="today" ? `ประวัติรับซื้อ_${todayKey()}.csv` : `ประวัติรับซื้อทั้งหมด_${todayKey()}.csv`;

    if(hasDesktop){
      try{
        const res = await window.scrapAPI.exportCSV(filename, csv);
        if(res.ok) push(`ส่งออกไฟล์เรียบร้อย: ${res.path}`,"ok");
        else push("ยกเลิกการบันทึกไฟล์","err");
      }catch(e){ push("ไม่สามารถส่งออกไฟล์ได้ในขณะนี้","err"); }
    } else {
      try{
        const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        push("ส่งออกไฟล์ CSV เรียบร้อย","ok");
      }catch(e){ push("ไม่สามารถส่งออกไฟล์ได้ในขณะนี้","err"); }
    }
  }

  return (
    <div className="app-shell">
      <div className="app-header">
        <div className="topbar">
          <div className="brand">
            <div className="brand-mark"><Icon name="magnet" size={20}/></div>
            <div>
              <div className="brand-name">ระบบ POS ค้าของเก่า by.leolung</div>
              <div className="brand-sub">{settings.storeName}</div>
            </div>
          </div>
          <div className="topbar-spacer"/>
          <NetBadge netStatus={netStatus} dataDir={dataDir}/>
          {hasDesktop && (
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowConnect(true)}><Icon name="smartphone" size={15}/>เชื่อมต่ออุปกรณ์อื่น</button>
          )}
          <button className="btn btn-ghost btn-sm" onClick={()=>exportCSV("today")}><Icon name="download" size={15}/>CSV วันนี้</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>exportCSV("all")}><Icon name="download" size={15}/>CSV ทั้งหมด</button>
          <Clock/>
        </div>

        <div className="page-nav">
          {PAGES.map(p=>(
            <button key={p.id} className={"page-tab "+(page===p.id?"active":"")} onClick={()=>setPage(p.id)}>
              <Icon name={p.icon} size={17}/>{p.label}
            </button>
          ))}
        </div>
      </div>

      {page==="pos" && (
        <div className="frame">
          <LeftPane
            customers={customers} search={search} setSearch={setSearch} searchResults={searchResults}
            selectedCustomer={selectedCustomer} setSelectedCustomerId={setSelectedCustomerId}
            bills={bills} onAddCustomer={()=>setShowAddCustomer(true)}
            selectedCategory={selectedCategory} setSelectedCategory={setSelectedCategory}
            categories={categories}
            onOpenSettings={()=>setPage("inventory")}
            priceMode={priceMode} setPriceMode={setPriceMode}
            walkInNickname={walkInNickname} setWalkInNickname={setWalkInNickname}
            walkInLicensePlate={walkInLicensePlate} setWalkInLicensePlate={setWalkInLicensePlate}
          />
          <CenterPane
            catalog={catalog} visibleItems={visibleItems} quickItems={quickItems}
            itemSearch={itemSearch} setItemSearch={setItemSearch}
            selectedCategory={selectedCategory} activeItem={activeItem} activeItemId={activeItemId} pickItem={pickItem}
            gross={gross} setGross={setGross} tare={tare} setTare={setTare} deductPct={deductPct} setDeductPct={setDeductPct}
            qty={qty} setQty={setQty} priceOverride={priceOverride} setPriceOverride={setPriceOverride}
            netWeight={netWeight} lineAmount={lineAmount} addLine={addLine}
            billItems={billItems} editLine={editLine} removeLine={removeLine} totals={totals}
            priceMode={priceMode} editingId={editingId} onCancelEdit={resetWeighForm}
            activeInputRef={activeInputRef} catLabelMap={catLabelMap}
          />
          <RightPane
            totals={totals} selectedCustomer={selectedCustomer}
            onFinish={finishSale} onClear={clearBill} bills={bills}
            heldBills={heldBills} onPark={parkBill} onResumeHeldBill={resumeHeldBill} onDeleteHeldBill={deleteHeldBill}
          />
        </div>
      )}

      {page==="inventory" && (
        <div className="page-body">
          <InventoryPage catalog={catalog} categories={categories}
            onUpdatePrice={updateCatalogPrice} onToggleQuick={toggleQuick}

            onUpdateCode={(id,code)=>updateCatalogText(id,"code",code)}

        </div>
      )}

      {page==="members" && (
        <div className="page-body">
          <MembersPage customers={customers} bills={bills} categories={categories}
            onAddCustomer={addCustomer} onUpdateCustomer={updateCustomer} onDeleteCustomer={deleteCustomer}

      )}

      {page==="history" && (
        <div className="page-body">
          <HistoryPage bills={bills} onDeleteBill={deleteBill} onReprint={reprintBill} onEditBill={(b)=>setEditingBill(b)}/>

      {page==="income" && (

      {page==="payroll" && (

        </div>
      )}

      {page==="settings" && (
        <div className="page-body">
          <SettingsPage settings={settings} onUpdateSettings={updateSettings} dataDir={dataDir}
            theme={theme} setTheme={setTheme} uiScale={uiScale} setUiScale={setUiScale}
            updateCheckStatus={updateCheckStatus} onCheckForUpdates={checkForUpdatesNow}/>
        </div>
      )}

      {showAddCustomer && <AddCustomerModal onClose={()=>{setShowAddCustomer(false); setCardPrefill(null);}} onSave={addCustomer} initialData={cardPrefill}/>}
      {showReceipt && lastBill && <ReceiptModal bill={lastBill} storeName={settings.storeName} printWidthMm={receiptPrintWidthMm} fontScale={receiptFontScale} onClose={()=>setShowReceipt(false)}/>}
      {editingBill && <BillEditModal bill={editingBill} catalog={catalog} onClose={()=>setEditingBill(null)} onSave={(items)=>updateBill(editingBill.id, items)}/>}
      {showConnect && <ConnectModal lanInfo={lanInfo} onClose={()=>setShowConnect(false)}/>}

      {updateInfo && (
        <div className="update-banner">
          <Icon name="download" size={16}/>
          <span>ดาวน์โหลดอัปเดตเวอร์ชัน {updateInfo.version} เสร็จแล้ว — รีสตาร์ทเพื่อติดตั้งตอนนี้ได้เลย (ถ้าไม่กด จะติดตั้งให้อัตโนมัติตอนปิดโปรแกรมครั้งถัดไป)</span>
          <button className="btn btn-primary btn-sm" onClick={()=>window.scrapAPI.installUpdate()}>รีสตาร์ทเพื่อติดตั้ง</button>
          <button className="icon-btn" title="ปิด" onClick={()=>setUpdateInfo(null)}><Icon name="x" size={15}/></button>
        </div>
      )}

      <div className="toast-wrap">
        {toasts.map(t=>(
          <div key={t.id} className={"toast "+t.type}>

        ))}
      </div>
    </div>
  );
}

function Clock(){
  const [now,setNow] = useState(new Date());
  useEffect(()=>{ const t=setInterval(()=>setNow(new Date()),1000*20); return ()=>clearInterval(t); },[]);
  return (
    <div className="topbar-clock">
      <div>{now.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
      <b>{now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}</b>
    </div>
  );
}

function NetBadge({netStatus, dataDir}){
  const online = netStatus==="online";
  const label = online ? "ออนไลน์ · ซิงก์กับอุปกรณ์อื่น" : netStatus==="connecting" ? "กำลังเชื่อมต่อ..." : "ออฟไลน์ · เครื่องนี้เท่านั้น";
  const title = hasDesktop
    ? `${dataDir ? `บันทึกไฟล์ที่: ${dataDir}\n` : ""}${online ? "เชื่อมกับอุปกรณ์อื่นบนวง WiFi เดียวกันอยู่" : "ยังไม่เชื่อมต่อกับอุปกรณ์อื่น"}`
    : (online ? "เชื่อมต่อกับคอมหลักอยู่ ข้อมูลซิงก์กันแบบเรียลไทม์" : "ขาดการเชื่อมต่อกับคอมหลัก — กำลังลองเชื่อมใหม่");
  return (
    <span className="sync-badge" title={title}>
      <span className={"sync-dot "+(netStatus==="connecting"?"":online?"on":"off")}/>
      <Icon name="hardDrive" size={12}/>
      {label}
    </span>
  );
}

function ConnectModal({lanInfo, onClose}){
  const [copied,setCopied] = useState(false);
  const url = lanInfo && lanInfo.url;
  function copyUrl(){
    if(!url) return;
    navigator.clipboard.writeText(url).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),1800); }).catch(()=>{});
  }
  return (
    <ModalShell title="เชื่อมต่ออุปกรณ์อื่น" onClose={onClose} footer={<button className="btn btn-primary" onClick={onClose}>ปิด</button>}>
      {url ? (
        <>
          <div className="field">
            <label>เปิดลิงก์นี้บนมือถือหรือแท็บเล็ตที่เชื่อม WiFi วงเดียวกับคอมเครื่องนี้</label>
            <div style={{display:"flex",gap:8}}>
              <input className="input tabular" readOnly value={url} onFocus={e=>e.target.select()}/>
              <button className="btn" onClick={copyUrl}>{copied?"คัดลอกแล้ว":"คัดลอก"}</button>
            </div>
          </div>
          <div className="idcard-box">
            <div className="idcard-status muted">
              เปิดเบราว์เซอร์บนมือถือ (Safari / Chrome) แล้วพิมพ์ลิงก์ด้านบน หรือส่งลิงก์นี้ไปที่มือถือผ่าน LINE/ข้อความ
              จากนั้นข้อมูลสมาชิก แคตตาล็อกราคา และบิลจะซิงก์กับเครื่องนี้แบบเรียลไทม์ทันทีที่เปิด
            </div>
            <div className="idcard-status ok"><Icon name="shieldCheck" size={14}/>ใช้งานได้เฉพาะอุปกรณ์ที่อยู่ใน WiFi วงเดียวกับร้านเท่านั้น</div>
          </div>
        </>
      ) : (
        <div className="idcard-status muted">ยังหาที่อยู่เครือข่ายของคอมเครื่องนี้ไม่พบ — ตรวจสอบว่าคอมเชื่อม WiFi หรือสาย LAN อยู่ แล้วลองเปิดหน้าต่างนี้ใหม่</div>
      )}
    </ModalShell>
  );
}

/* ============================= CENTER PANE ============================= */
function CenterPane({catalog, visibleItems, quickItems, itemSearch, setItemSearch, selectedCategory, activeItem, activeItemId, pickItem,
  gross,setGross,tare,setTare,deductPct,setDeductPct,qty,setQty,priceOverride,setPriceOverride,
  netWeight, lineAmount, addLine, billItems, editLine, removeLine, totals, priceMode, editingId, onCancelEdit, activeInputRef, catLabelMap}){

  const onFocusTrack = (e)=>{ if(activeInputRef) activeInputRef.current = e.target; };
  const onEnterSubmit = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); addLine(); } };
  const primaryFieldRef = useRef(null);
  useEffect(()=>{
    // autoFocus ไม่ยิง React onFocus เสมอไป จึงต้องผูก ref ตรงให้แป้นตัวเลขรู้ว่าช่องไหนกำลังใช้งาน
    if(activeItem && primaryFieldRef.current && activeInputRef){
      activeInputRef.current = primaryFieldRef.current;
    }
  },[activeItem]);

  const [expanded, setExpanded] = useState({});
  const toggleExpand = (itemId) => setExpanded(e=>({...e, [itemId]: !e[itemId]}));

  const groups = useMemo(()=>{
    const order = []; const map = new Map();
    billItems.forEach(l=>{
      if(!map.has(l.itemId)){ map.set(l.itemId, []); order.push(l.itemId); }
      map.get(l.itemId).push(l);
    });
    return order.map(itemId=>{
      const lines = map.get(itemId);
      const first = lines[0];
      const netSum = lines.reduce((s,l)=> s + (l.mode==="weight"?l.net:0), 0);
      const qtySum = lines.reduce((s,l)=> s + (l.mode==="unit"?l.qty:0), 0);
      const amountSum = lines.reduce((s,l)=>s+l.amount,0);
      return { itemId, name:first.name, category:first.category, mode:first.mode, unit:first.unit, lines, netSum, qtySum, amountSum };
    });
  },[billItems]);

  const sameItemLines = activeItem ? billItems.filter(l=>l.itemId===activeItem.id && l.id!==editingId) : [];
  const existingNet = sameItemLines.reduce((s,l)=> s + (l.mode==="weight"?l.net:0), 0);
  const existingQty = sameItemLines.reduce((s,l)=> s + (l.mode==="unit"?l.qty:0), 0);
  const existingAmount = sameItemLines.reduce((s,l)=>s+l.amount,0);

  const searching = itemSearch.trim().length>0;

  return (
    <div className="pane">
      <div className="panel">
        <div className="input-wrap">
          <span className="search-icon"><Icon name="search" size={15}/></span>
          <input className="input input-search" placeholder="ค้นหาสินค้า ด้วยชื่อ หรือ รหัสสินค้า..."

/* ============================= NUMPAD ============================= */
function Numpad({targetRef, onSubmit, editingId}){
  function press(key){
    const el = targetRef && targetRef.current;
    if(!el){ return; }
    let v = el.value || "";
    if(key==="C") v = "";
    else if(key==="back") v = v.slice(0,-1);
    else if(key===".") { if(!v.includes(".")) v += "."; }
    else v += key;
    setReactInputValue(el, v);
    el.focus();
  }
  const keys = ["7","8","9","4","5","6","1","2","3",".","0","back"];
  return (
    <div className="numpad">
      <div className="numpad-grid">
        {keys.map(k=>(
          <button key={k} type="button" className="numpad-btn"
            onMouseDown={e=>e.preventDefault()} onClick={()=>press(k)}>
            {k==="back" ? <Icon name="x" size={17}/> : k}
          </button>
        ))}
      </div>
      {onSubmit && (
        <button type="button" className="btn btn-primary btn-block numpad-confirm"
          onMouseDown={e=>e.preventDefault()} onClick={onSubmit}>
          <Icon name={editingId?"check":"plus"} size={16}/>{editingId ? "บันทึกการแก้ไข" : "เพิ่มรายการลงบิล"}
        </button>
      )}
      <button type="button" className="numpad-clear" onMouseDown={e=>e.preventDefault()} onClick={()=>press("C")}>ล้างค่า</button>
    </div>
  );
}

function BillEditModal({bill, catalog, onClose, onSave}){
  const [items,setItems] = useState(()=>bill.items.map(it=>({
    ...it,
    net: it.mode==="weight" ? String(it.net ?? 0) : undefined,
    qty: it.mode==="unit" ? String(it.qty ?? 0) : undefined,
    price: String(it.price ?? 0),
  })));
  const [addItemId,setAddItemId] = useState("");

  function updateItemField(idx, field, value){
    setItems(list=>list.map((it,i)=> i===idx ? {...it, [field]:filterDecimalInput(value)} : it));
  }
  function removeItem(idx){
    setItems(list=>list.filter((_,i)=>i!==idx));
  }
  function addItemFromCatalog(){
    const cat = catalog.find(c=>c.id===addItemId);
    if(!cat) return;
    const price = cat.priceCasual ?? cat.priceRegular ?? 0;
    setItems(list=>[...list, {
      id: uid(), itemId: cat.id, name: cat.name, category: cat.category,
      mode: cat.mode, unit: cat.unit,
      net: cat.mode==="weight" ? "0" : undefined,
      qty: cat.mode==="unit" ? "0" : undefined,
      price: String(price), priceMode:"casual",
    }]);
    setAddItemId("");
  }

  const computedItems = useMemo(()=>items.map(it=>{
    const qty = parseFloat(it.mode==="weight" ? it.net : it.qty)||0;
    const price = parseFloat(it.price)||0;
    return {...it, amount: qty*price};
  }),[items]);
  const stats = billStats({items:computedItems});
  const canSave = computedItems.length>0;

  function handleSave(){
    onSave(computedItems.map(it=> it.mode==="weight"
      ? {...it, net:parseFloat(it.net)||0, price:parseFloat(it.price)||0}
      : {...it, qty:parseFloat(it.qty)||0, price:parseFloat(it.price)||0}));
  }

  return (
    <ModalShell title={`แก้ไขบิล #${bill.no}`} onClose={onClose} wide footer={
      <>
        <button className="btn" onClick={onClose}>ยกเลิก</button>
        <button className="btn btn-primary" disabled={!canSave} onClick={handleSave}>บันทึกการแก้ไข</button>
      </>
    }>
      <div style={{fontSize:13,color:"var(--ink-muted)",marginBottom:10}}>
        {bill.customerName} · {fmtDateTime(bill.date)}
      </div>
      <div className="data-table-wrap">
        <table className="data-table">
          <thead><tr><th>สินค้า</th><th>น้ำหนัก/จำนวน</th><th>ราคา/หน่วย</th><th>รวม</th><th></th></tr></thead>
          <tbody>
            {computedItems.length===0 && (
              <tr><td colSpan={5} className="empty-bill" style={{textAlign:"center"}}>ไม่มีรายการ — เพิ่มด้านล่าง</td></tr>
            )}
            {computedItems.map((it,idx)=>(
              <tr key={it.id}>
                <td className="item-name-ink">{it.name}</td>
                <td>
                  <input className="inline-input tabular" style={{maxWidth:100}} type="text" inputMode="decimal"
                    value={it.mode==="weight" ? it.net : it.qty}
                    onChange={e=>updateItemField(idx, it.mode==="weight"?"net":"qty", e.target.value)}/>
                </td>
                <td>
                  <input className="inline-input tabular" style={{maxWidth:90}} type="text" inputMode="decimal"
                    value={it.price} onChange={e=>updateItemField(idx,"price",e.target.value)}/>
                </td>
                <td className="tabular" style={{fontWeight:700}}>{money(it.amount)}</td>
                <td>
                  <button className="icon-btn" title="ลบรายการ" style={{color:"var(--danger)"}} onClick={()=>removeItem(idx)}>
                    <Icon name="trash" size={15}/>
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{display:"flex",gap:8,marginTop:10,alignItems:"end"}}>
        <div className="field" style={{flex:1}}>
          <label>เพิ่มรายการจากสินค้า</label>
          <select className="select" value={addItemId} onChange={e=>setAddItemId(e.target.value)}>
            <option value="">-- เลือกสินค้า --</option>
            {catalog.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
        <button className="btn" disabled={!addItemId} onClick={addItemFromCatalog}><Icon name="plus" size={15}/>เพิ่ม</button>
      </div>
      <div style={{marginTop:14,display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:700,borderTop:"1px solid var(--border)",paddingTop:10}}>
        <span>ยอดรวมใหม่ · {kg(stats.weight)} กก.</span>
        <span className="tabular" style={{color:"var(--money)"}}>{money(stats.amount)} ฿</span>
      </div>
    </ModalShell>
  );
}

function groupReceiptItems(items){
  const order = []; const map = new Map();
  items.forEach(it=>{
    if(!map.has(it.itemId)){ map.set(it.itemId, []); order.push(it.itemId); }
    map.get(it.itemId).push(it);
  });
  return order.map(itemId=>{
    const lines = map.get(itemId);
    const first = lines[0];
    const netSum = lines.reduce((s,l)=> s + (l.mode==="weight"?l.net:0), 0);
    const qtySum = lines.reduce((s,l)=> s + (l.mode==="unit"?l.qty:0), 0);
    const amountSum = lines.reduce((s,l)=>s+l.amount,0);
    const denom = first.mode==="weight" ? netSum : qtySum;
    const avgPrice = denom>0 ? amountSum/denom : first.price;
    return { itemId, name:first.name, mode:first.mode, unit:first.unit, netSum, qtySum, amountSum, avgPrice };
  });
}

    if(!hasDesktop) return;

      const r = el.getBoundingClientRect();
      const rect = {x:Math.round(r.x), y:Math.round(r.y), width:Math.round(r.width), height:Math.round(r.height)};
      if(rect.width<=0 || rect.height<=0) return;
      window.scrapAPI.saveReceiptImage(rect, bill.no, bill.date).catch(()=>{});

    <div className="modal-backdrop" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{maxWidth: Math.max(380, widthMm*3.78 + 40)}}>

  const [expandedDay,setExpandedDay] = useState(null);

  const searchFiltered = useMemo(()=>{
    const q = search.trim().toLowerCase();
    if(!q) return bills;
    return bills.filter(b=> b.customerName.toLowerCase().includes(q) || String(b.no).includes(q)
      || (b.customerNickname||"").toLowerCase().includes(q) || (b.customerLicensePlate||"").toLowerCase().includes(q));
  },[bills, search]);

  const filtered = useMemo(()=>{
    let list = scope==="today" ? searchFiltered.filter(b=>b.date.slice(0,10)===todayKey()) : searchFiltered;
    return list.slice().sort((a,b)=>b.date.localeCompare(a.date));
  },[searchFiltered, scope]);

  const dailyGroups = useMemo(()=>{
    const map = new Map();
    searchFiltered.forEach(b=>{
      const d = b.date.slice(0,10);
      if(!map.has(d)) map.set(d, []);
      map.get(d).push(b);
    });
    return Array.from(map.entries()).map(([date,list])=>{
      const dayBills = list.slice().sort((a,b)=>b.date.localeCompare(a.date));
      return {
        date, bills: dayBills,
        count: dayBills.length,
        weight: dayBills.reduce((s,b)=>s+billStats(b).weight,0),
        amount: dayBills.reduce((s,b)=>s+billStats(b).amount,0),
      };
    }).sort((a,b)=>b.date.localeCompare(a.date));
  },[searchFiltered]);

  const isDaily = scope==="daily";
  const statsSource = isDaily ? searchFiltered : filtered;
  const totalAmount = statsSource.reduce((s,b)=>s+billStats(b).amount,0);
  const totalWeight = statsSource.reduce((s,b)=>s+billStats(b).weight,0);

          <div className="stat-tile-label">น้ำหนักรวม</div>
          <div className="stat-tile-val tabular">{kg(totalWeight)} กก.</div>
        </div>
        <div className="stat-tile">
          <div className="stat-tile-label">ยอดเงินรวม</div>

      <div className="panel">
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
          <div className="mode-toggle" style={{maxWidth:320}}>
            <button type="button" className={scope==="today"?"active":""} onClick={()=>setScope("today")}>วันนี้</button>
            <button type="button" className={scope==="all"?"active":""} onClick={()=>setScope("all")}>ทั้งหมด</button>
            <button type="button" className={scope==="daily"?"active":""} onClick={()=>setScope("daily")}>สรุปรายวัน</button>
          </div>
          <div className="input-wrap" style={{flex:"1 1 220px"}}>
            <span className="search-icon"><Icon name="search" size={15}/></span>
            <input className="input input-search" placeholder="ค้นหาเลขบิล ชื่อลูกค้า ชื่อเล่น หรือทะเบียนรถ..." value={search} onChange={e=>setSearch(e.target.value)}/>

      {isDaily ? (

            <table className="data-table">
