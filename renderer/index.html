                        <td className="tabular">{g.count}</td>
                        <td className="tabular">{kg(g.weight)} กก.</td>
                        <td className="tabular" style={{fontWeight:700,color:"var(--money)"}}>{money(g.amount)} ฿</td>
                      </tr>
                      {isOpen && (
                        <tr>
                          <td colSpan={4} style={{background:"var(--bg-2)",padding:"10px 14px"}}>
                            <table className="data-table" style={{background:"transparent"}}>
                              <thead><tr>
                                <th>เลขที่</th><th>วันที่เวลา</th><th>ลูกค้า</th><th>น้ำหนักรวม</th><th>ยอดเงิน</th><th></th>
                              </tr></thead>
                              <tbody>
                                {g.bills.map(b=>(
                                  <BillRow key={b.id} b={b} isOpen={expandedId===b.id}
                                    onToggle={()=>setExpandedId(expandedId===b.id?null:b.id)}
                                    onReprint={onReprint} onDeleteBill={onDeleteBill} onEditBill={onEditBill} colSpan={6}/>
                                ))}
                              </tbody>
                            </table>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      ) : (
        <div className="data-table-wrap">
          {filtered.length===0 ? (
            <div className="empty-bill">ไม่มีบิลที่ตรงกับเงื่อนไข</div>
          ) : (
            <table className="data-table">
              <thead><tr>
                <th>เลขที่</th><th>วันที่เวลา</th><th>ลูกค้า</th><th>น้ำหนักรวม</th><th>ยอดเงิน</th><th></th>
              </tr></thead>
              <tbody>
                {filtered.map(b=>(
                  <BillRow key={b.id} b={b} isOpen={expandedId===b.id}
                    onToggle={()=>setExpandedId(expandedId===b.id?null:b.id)}
                    onReprint={onReprint} onDeleteBill={onDeleteBill} onEditBill={onEditBill} colSpan={6}/>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
    </>
  );
}

/* ============================= MEMBERS PAGE ============================= */
function MembersPage({customers, bills, categories, onAddCustomer, onUpdateCustomer, onDeleteCustomer, onReprint, onEditBill}){
  const [search,setSearch] = useState("");
  const [selectedId,setSelectedId] = useState(null);
  const [modalMode,setModalMode] = useState(null); // null | "new" | <customer object> (แก้ไข)

  const catLabelMap = useMemo(()=>Object.fromEntries(categories.map(c=>[c.id,c.label])), [categories]);

  const filtered = useMemo(()=>{
    const q = search.trim().toLowerCase();
    let list = customers.slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    if(q) list = list.filter(c=>
      c.name.toLowerCase().includes(q) || (c.phone||"").includes(q) || (c.idCard||"").includes(q)
      || (c.nickname||"").toLowerCase().includes(q) || (c.licensePlate||"").toLowerCase().includes(q));
    return list;
  },[customers, search]);

  useEffect(()=>{
    if(selectedId && !customers.some(c=>c.id===selectedId)) setSelectedId(null);
  },[customers, selectedId]);

  const selected = customers.find(c=>c.id===selectedId) || null;
  const stats = selected ? customerStats(selected.id, bills) : null;

  const categoryBreakdown = useMemo(()=>{
    if(!stats) return [];
    const map = new Map();
    stats.bills.forEach(b=>{
      b.items.forEach(it=>{
        const key = it.category || "misc";
        const cur = map.get(key) || {category:key, weight:0, amount:0};
        if(it.mode==="weight") cur.weight += it.net;
        cur.amount += it.amount;
        map.set(key, cur);
      });
    });
    return Array.from(map.values()).sort((a,b)=>b.amount-a.amount);
  },[stats]);

  function handleDelete(c){
    if(!window.confirm(`ลบสมาชิก "${c.name}" ใช่หรือไม่? (ประวัติบิลเดิมจะยังอยู่ในระบบ แต่จะไม่ผูกกับสมาชิกนี้อีก)`)) return;
    onDeleteCustomer(c.id);
  }

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">จัดการสมาชิก</div>
          <div className="page-sub">ดูข้อมูลบัตรประชาชน แก้ไข/ลบสมาชิก และประวัติการซื้อขายแยกตามหมวดหมู่</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setModalMode("new")}>
          <Icon name="userPlus" size={16}/>เพิ่มสมาชิกใหม่
        </button>
      </div>

      <div className="stat-row">
        <div className="stat-tile">
          <div className="stat-tile-label">จำนวนสมาชิกทั้งหมด</div>
          <div className="stat-tile-val tabular">{customers.length}</div>
        </div>
        <div className="stat-tile">
          <div className="stat-tile-label">ยืนยันตัวตนด้วยบัตรแล้ว</div>
          <div className="stat-tile-val tabular">{customers.filter(c=>c.idVerified).length}</div>
        </div>
      </div>

      <div className="members-grid">
        <div className="member-list-col panel">
          <div className="input-wrap">
            <span className="search-icon"><Icon name="search" size={15}/></span>
            <input className="input input-search" placeholder="ค้นหาชื่อ เบอร์โทร หรือเลขบัตร..."
              value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <div style={{marginTop:8, display:"flex", flexDirection:"column", gap:2, maxHeight:560, overflowY:"auto"}}>
            {filtered.length===0 && <div style={{fontSize:12.5,color:"var(--ink-faint)",padding:"8px 2px"}}>ไม่พบสมาชิก</div>}
            {filtered.map(c=>{
              const s = customerStats(c.id, bills);
              return (
                <div key={c.id} className={"member-row "+(selectedId===c.id?"active":"")} onClick={()=>setSelectedId(c.id)}>
                  <div>
                    <div className="member-row-name">
                      {c.name}
                      {c.idVerified && <Icon name="shieldCheck" size={12}/>}
                    </div>
                    <div className="member-row-meta">{c.phone||"-"} · {s.visits} ครั้ง</div>
                  </div>
                  <span className={"badge "+typeMeta(c.type).badge}>{typeMeta(c.type).label}</span>
                </div>
              );
            })}
          </div>
        </div>

        <div className="member-detail-col panel">
          {!selected ? (
            <div style={{textAlign:"center", color:"var(--ink-faint)", padding:"40px 10px"}}>
              เลือกสมาชิกจากรายการด้านซ้าย เพื่อดูรายละเอียด
            </div>
          ) : (
            <>
              <div className="member-detail-head">
                {selected.photo ? <img src={selected.photo} className="member-photo-lg" alt=""/> :
                  <div className="member-photo-ph"><Icon name="user" size={30}/></div>}
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <div className="ac-name" style={{fontSize:19}}>{selected.name}{selected.nickname && <span style={{fontWeight:400,color:"var(--ink-muted)"}}> ({selected.nickname})</span>}</div>
                    <span className={"badge "+typeMeta(selected.type).badge}>{typeMeta(selected.type).label}</span>
                  </div>
                  <div className="ac-phone" style={{marginTop:4}}><Icon name="phone" size={12}/>{selected.phone||"-"}</div>
                  {selected.licensePlate && <div className="ac-phone">ทะเบียน {selected.licensePlate}</div>}
                  {selected.idVerified ? (
                    <div className="ac-verified"><Icon name="shieldCheck" size={13}/>ยืนยันตัวตนแล้ว · {maskThaiID(selected.idCard)}</div>
                  ) : selected.idCard ? (
                    <div className="ac-verified" style={{color:"var(--ink-muted)"}}>เลขบัตร {maskThaiID(selected.idCard)}</div>
                  ) : null}
                  <div style={{marginTop:9,display:"flex",gap:8}}>
                    <button className="btn" onClick={()=>setModalMode(selected)}><Icon name="pencil" size={14}/>แก้ไข</button>
                    <button className="btn" style={{color:"var(--danger)"}} onClick={()=>handleDelete(selected)}><Icon name="trash" size={14}/>ลบสมาชิก</button>
                  </div>
                </div>
              </div>

              {selected.cardInfo && (selected.cardInfo.address || selected.cardInfo.birthDateIso) && (
                <div className="panel" style={{marginTop:12, background:"var(--bg-2)"}}>
                  <div className="panel-title"><Icon name="creditCard" size={13}/>ข้อมูลจากบัตรประชาชน</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 16px",fontSize:12.5}}>
                    {selected.cardInfo.englishName && <div><span style={{color:"var(--ink-faint)"}}>ชื่อ (EN): </span>{selected.cardInfo.englishName}</div>}
                    {selected.cardInfo.gender && <div><span style={{color:"var(--ink-faint)"}}>เพศ: </span>{selected.cardInfo.gender}</div>}
                    {selected.cardInfo.birthDateIso && <div><span style={{color:"var(--ink-faint)"}}>วันเกิด: </span>{fmtDateOnlyTH(selected.cardInfo.birthDateIso)}</div>}
                    {selected.cardInfo.issueDateIso && <div><span style={{color:"var(--ink-faint)"}}>วันออกบัตร: </span>{fmtDateOnlyTH(selected.cardInfo.issueDateIso)}</div>}
                    {selected.cardInfo.expireDateIso && <div><span style={{color:"var(--ink-faint)"}}>วันหมดอายุ: </span>{fmtDateOnlyTH(selected.cardInfo.expireDateIso)}</div>}
                  </div>
                  {selected.cardInfo.address && (
                    <div style={{marginTop:6,fontSize:12.5}}><span style={{color:"var(--ink-faint)"}}>ที่อยู่: </span>{selected.cardInfo.address}</div>
                  )}
                </div>
              )}

              <div className="stat-row" style={{marginTop:12}}>
                <div className="stat-tile">
                  <div className="stat-tile-label">ซื้อขายแล้ว</div>
                  <div className="stat-tile-val tabular">{stats.visits} ครั้ง</div>
                </div>
                <div className="stat-tile">
                  <div className="stat-tile-label">ยอดซื้อขายรวม</div>
                  <div className="stat-tile-val tabular" style={{color:"var(--money)"}}>{money(stats.spent)} ฿</div>
                </div>
              </div>

              {categoryBreakdown.length>0 && (
                <div className="panel" style={{marginTop:12}}>
                  <div className="panel-title"><Icon name="layers" size={13}/>สรุปตามหมวดหมู่สินค้า</div>
                  {categoryBreakdown.map(row=>(
                    <div key={row.category} className="cat-breakdown-row">
                      <span>{catLabelMap[row.category] || "อื่นๆ"}</span>
                      <span className="tabular">{row.weight>0 ? `${kg(row.weight)} กก. · ` : ""}{money(row.amount)} ฿</span>
                    </div>
                  ))}
                </div>
              )}

              <div className="panel" style={{marginTop:12}}>
                <div className="panel-title"><Icon name="history" size={13}/>ประวัติการซื้อขายล่าสุด</div>
                {stats.bills.length===0 ? (
                  <div className="empty-bill">ยังไม่มีประวัติการซื้อขาย</div>
                ) : (
                  <div className="data-table-wrap">
                    <table className="data-table">
                      <thead><tr><th>เลขที่</th><th>วันที่เวลา</th><th>น้ำหนักรวม</th><th>ยอดเงิน</th><th></th></tr></thead>
                      <tbody>
                        {stats.bills.slice(0,20).map(b=>{
                          const s = billStats(b);
                          return (
                            <tr key={b.id}>
                              <td className="tabular">#{b.no}</td>
                              <td className="tabular">{fmtDateTime(b.date)}</td>
                              <td className="tabular">{kg(s.weight)} กก.</td>
                              <td className="tabular" style={{fontWeight:700}}>{money(s.amount)} ฿</td>
                              <td>
                                <div className="row-actions">
                                  {onReprint && (
                                    <button className="icon-btn" title="พิมพ์ใบเสร็จซ้ำ" onClick={()=>onReprint(b)}>
                                      <Icon name="printer" size={15}/>
                                    </button>
                                  )}
                                  {onEditBill && (
                                    <button className="icon-btn" title="แก้ไขบิล" onClick={()=>onEditBill(b)}>
                                      <Icon name="pencil" size={15}/>
                                    </button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      </div>

      {modalMode && (
        <AddCustomerModal
          initialData={modalMode==="new" ? null : modalMode}
          onClose={()=>setModalMode(null)}
          onSave={(data)=>{
            if(modalMode==="new") onAddCustomer(data);
            else onUpdateCustomer(modalMode.id, data);
            setModalMode(null);
          }}
        />
      )}
    </>
  );
}

    <div className="panel">

      </div>
    </div>
  );
}

/* ============================= INCOME PAGE ============================= */
function IncomePage({extraIncome, bills, advances, onAddIncome, onDeleteIncome, onIssueReceipt}){
  const [date,setDate] = useState(todayKey());
  const [description,setDescription] = useState("");
  const [amount,setAmount] = useState("");
  const [pendingItems,setPendingItems] = useState([]); // รายการที่กำลังเพิ่ม ยังไม่บันทึกเป็นบิล
  const [scope,setScope] = useState("today");
  const [expandedId,setExpandedId] = useState(null);
  const descRef = useRef(null);

  function addPendingItem(){
    const amt = parseFloat(amount)||0;
    if(!description.trim() || amt<=0) return;
    setPendingItems(list=>[...list, {id:uid(), description:description.trim(), amount:amt}]);
    setDescription(""); setAmount("");
    if(descRef.current) descRef.current.focus();
  }
  function removePendingItem(id){
    setPendingItems(list=>list.filter(x=>x.id!==id));
  }
  function submitBill(){
    if(pendingItems.length===0) return;
    onAddIncome({date: date||todayKey(), items: pendingItems});
    setPendingItems([]);
    setDate(todayKey());
  }
  const pendingTotal = pendingItems.reduce((s,i)=>s+i.amount,0);

  const filtered = useMemo(()=>{
    let list = scope==="today" ? extraIncome.filter(i=>i.date===todayKey()) : extraIncome;
    return list.slice().sort((a,b)=>b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  },[extraIncome, scope]);
  const filteredTotal = filtered.reduce((s,i)=>s+i.amount,0);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">รายรับเสริม</div>
          <div className="page-sub">บันทึกรายได้จากการขายสินค้าเล็กน้อยของร้าน แยกจากยอดซื้อของเก่า — เพิ่มได้หลายรายการในบิลเดียว</div>
        </div>
      </div>

      <FinanceSummary bills={bills} extraIncome={extraIncome} advances={advances}/>

      <div className="panel">
        <div className="panel-title"><Icon name="plus" size={13}/>บันทึกรายรับใหม่</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"end"}}>
          <div className="field" style={{flex:"1 1 150px"}}><label>วันที่</label>
            <input type="date" className="input tabular" value={date} onChange={e=>setDate(e.target.value)}/>
          </div>
          <div className="field" style={{flex:"2 1 220px"}}><label>รายการ</label>
            <input ref={descRef} className="input" value={description} onChange={e=>setDescription(e.target.value)} placeholder="เช่น ขายขวดน้ำ, ขายเศษพลาสติกให้ลูกค้าเดินผ่าน" onKeyDown={e=>{if(e.key==="Enter") addPendingItem();}}/>
          </div>
          <div className="field" style={{flex:"1 1 120px"}}><label>จำนวนเงิน</label>
            <input className="input tabular" type="number" min="0" step="1" value={amount} onChange={e=>setAmount(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") addPendingItem();}}/>
          </div>
          <button className="btn" onClick={addPendingItem}><Icon name="plus" size={16}/>เพิ่มรายการ</button>
        </div>

        {pendingItems.length>0 && (
          <div style={{marginTop:12}}>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {pendingItems.map(p=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",border:"1px solid var(--border)",borderRadius:"var(--radius)",background:"var(--surface-2)"}}>
                  <span style={{flex:1}}>{p.description}</span>
                  <span className="tabular" style={{fontWeight:700,color:"var(--money)"}}>{money(p.amount)} ฿</span>
                  <button className="icon-btn" title="ลบรายการนี้" style={{color:"var(--danger)"}} onClick={()=>removePendingItem(p.id)}>
                    <Icon name="x" size={15}/>
                  </button>
                </div>
              ))}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,gap:10,flexWrap:"wrap"}}>
              <div style={{fontSize:14}}>รวม {pendingItems.length} รายการ · <b className="tabular" style={{color:"var(--money)"}}>{money(pendingTotal)} ฿</b></div>
              <button className="btn btn-primary" onClick={submitBill}><Icon name="check" size={16}/>บันทึกรายรับ ({pendingItems.length} รายการ)</button>
            </div>
          </div>
        )}
      </div>

      <div className="panel">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div className="mode-toggle" style={{maxWidth:220}}>
            <button type="button" className={scope==="today"?"active":""} onClick={()=>setScope("today")}>วันนี้</button>
            <button type="button" className={scope==="all"?"active":""} onClick={()=>setScope("all")}>ทั้งหมด</button>
          </div>
          <div style={{fontSize:14,fontWeight:700}}>รวม <span className="tabular" style={{color:"var(--money)"}}>{money(filteredTotal)} ฿</span></div>
        </div>
      </div>

      <div className="data-table-wrap">
        {filtered.length===0 ? (
          <div className="empty-bill">ยังไม่มีรายการรายรับ</div>
        ) : (
          <table className="data-table">
            <thead><tr><th>วันที่</th><th>รายการ</th><th>จำนวนเงิน</th><th></th></tr></thead>
            <tbody>
              {filtered.map(i=>{
                const lineItems = i.items || [{id:i.id, description:i.description, amount:i.amount}];
                const multi = lineItems.length>1;
                const isOpen = expandedId===i.id;
                return (
                  <React.Fragment key={i.id}>
                    <tr style={multi?{cursor:"pointer"}:undefined} onClick={multi?()=>setExpandedId(isOpen?null:i.id):undefined}>
                      <td className="tabular">{fmtDateOnlyTH(i.date)}</td>
                      <td className="item-name-ink">
                        {multi ? (
                          <span style={{display:"inline-flex",alignItems:"center",gap:6}}>
                            <Icon name="chevronRight" size={13} className={"group-chevron "+(isOpen?"open":"")}/>
                            {lineItems[0].description}
                            <span className="round-badge">{lineItems.length} รายการ</span>
                          </span>
                        ) : lineItems[0].description}
                      </td>
                      <td className="tabular" style={{fontWeight:700,color:"var(--money)"}}>{money(i.amount)} ฿</td>
                      <td>
                        <div className="row-actions">
                          <button className="icon-btn" title="ออกบิล/พิมพ์ใบเสร็จ" onClick={e=>{e.stopPropagation(); onIssueReceipt(i);}}>
                            <Icon name="printer" size={16}/>
                          </button>
                          <button className="icon-btn" title="ลบ" style={{color:"var(--danger)"}} onClick={e=>{e.stopPropagation(); onDeleteIncome(i.id);}}>
                            <Icon name="trash" size={16}/>
                          </button>
                        </div>
                      </td>
                    </tr>
                    {multi && isOpen && (
                      <tr>
                        <td colSpan={4} style={{background:"var(--bg-2)",padding:"10px 14px"}}>
                          <table className="data-table" style={{background:"transparent"}}>
                            <thead><tr><th>รายการ</th><th>จำนวนเงิน</th></tr></thead>
                            <tbody>
                              {lineItems.map(li=>(
                                <tr key={li.id}>
                                  <td className="item-name-ink">{li.description}</td>
                                  <td className="tabular">{money(li.amount)} ฿</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

/* ============================= PAYROLL PAGE ============================= */
function PayrollPage({employees, advances, extraIncome, bills, onAddEmployee, onUpdateEmployee, onDeleteEmployee, onAddAdvance, onDeleteAdvance, onUpdateAdvance}){
  const [enName,setEnName] = useState(""); const [enPos,setEnPos] = useState(""); const [enSalary,setEnSalary] = useState("");
  const [advEmployeeId,setAdvEmployeeId] = useState("");
  const [advDate,setAdvDate] = useState(todayKey());
  const [advAmount,setAdvAmount] = useState("");
  const [advNote,setAdvNote] = useState("");
  const [scope,setScope] = useState("today");
  const monthKey = monthKeyToday();

  useEffect(()=>{
    if(!employees.some(e=>e.id===advEmployeeId)) setAdvEmployeeId(employees[0]?.id || "");
  },[employees]);

  function submitEmployee(){
    if(!enName.trim()) return;
    onAddEmployee({name:enName, position:enPos, monthlySalary:parseFloat(enSalary)||0});
    setEnName(""); setEnPos(""); setEnSalary("");
  }
  function submitAdvance(){
    const amt = parseFloat(advAmount)||0;
    if(!advEmployeeId || amt<=0) return;
    onAddAdvance({employeeId:advEmployeeId, date:advDate||todayKey(), amount:amt, note:advNote});
    setAdvAmount(""); setAdvNote("");
  }

  const empSummary = useMemo(()=>{
    return employees.map(e=>{
      const advThisMonth = advances.filter(a=>a.employeeId===e.id && monthKeyOf(a.date)===monthKey).reduce((s,a)=>s+a.amount,0);
      return { ...e, advThisMonth, remaining: (e.monthlySalary||0) - advThisMonth };
    });
  },[employees, advances, monthKey]);

  const filteredAdvances = useMemo(()=>{
    let list = scope==="today" ? advances.filter(a=>a.date===todayKey()) : advances;
    return list.slice().sort((a,b)=>b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  },[advances, scope]);

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">เงินเดือน / เบิกเงิน</div>
          <div className="page-sub">จัดการพนักงาน เงินเดือนตั้งต้น และเงินเบิกรายวัน — ยอดคงเหลือคำนวณให้อัตโนมัติทุกเดือน</div>
        </div>
      </div>

      <FinanceSummary bills={bills} extraIncome={extraIncome} advances={advances}/>

      <div className="panel">
        <div className="panel-title"><Icon name="users" size={13}/>พนักงาน · {fmtMonthLabel(monthKey)}</div>
        <div className="data-table-wrap">
          <table className="data-table">
            <thead><tr><th>ชื่อ</th><th>ตำแหน่ง</th><th>เงินเดือน</th><th>เบิกไปแล้ว</th><th>คงเหลือที่ต้องจ่าย</th><th></th></tr></thead>
            <tbody>
              {empSummary.length===0 && (
                <tr><td colSpan={6} className="empty-bill" style={{textAlign:"center"}}>ยังไม่มีพนักงาน — เพิ่มด้านล่าง</td></tr>
              )}
              {empSummary.map(e=>(
                <tr key={e.id}>
                  <td className="item-name-ink" style={{fontWeight:700}}>{e.name}</td>
                  <td>
                    <input className="inline-input" style={{maxWidth:140}} value={e.position||""}
                      onChange={ev=>onUpdateEmployee(e.id,{position:ev.target.value})} placeholder="-"/>
                  </td>
                  <td>
                    <input className="inline-input tabular" style={{maxWidth:110}} type="number" min="0" step="100" value={e.monthlySalary}
                      onChange={ev=>onUpdateEmployee(e.id,{monthlySalary:parseFloat(ev.target.value)||0})}/>
                  </td>
                  <td className="tabular" style={{color:"var(--danger)"}}>-{money(e.advThisMonth)} ฿</td>
                  <td className="tabular" style={{fontWeight:700, color: e.remaining>=0 ? "var(--money)" : "var(--danger)"}}>{money(e.remaining)} ฿</td>
                  <td>
                    <button className="icon-btn" title="ลบพนักงาน" style={{color:"var(--danger)"}} onClick={()=>onDeleteEmployee(e.id)}>
                      <Icon name="trash" size={16}/>
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"end",marginTop:10}}>
          <div className="field" style={{flex:"1 1 160px"}}><label>ชื่อพนักงาน</label>
            <input className="input" value={enName} onChange={e=>setEnName(e.target.value)} placeholder="ชื่อพนักงาน"/>
          </div>
          <div className="field" style={{flex:"1 1 140px"}}><label>ตำแหน่ง</label>
            <input className="input" value={enPos} onChange={e=>setEnPos(e.target.value)} placeholder="เช่น พนักงานชั่งของ"/>
          </div>
          <div className="field" style={{flex:"1 1 120px"}}><label>เงินเดือน</label>
            <input className="input tabular" type="number" min="0" step="100" value={enSalary} onChange={e=>setEnSalary(e.target.value)}/>
          </div>
          <button className="btn btn-primary" onClick={submitEmployee}><Icon name="plus" size={16}/>เพิ่มพนักงาน</button>
        </div>
      </div>

      <div className="panel">
        <div className="panel-title"><Icon name="wallet" size={13}/>บันทึกเบิกเงิน</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"end"}}>
          <div className="field" style={{flex:"1 1 160px"}}><label>พนักงาน</label>
            <select className="select" value={advEmployeeId} onChange={e=>setAdvEmployeeId(e.target.value)}>
              {employees.length===0 && <option value="">-- ยังไม่มีพนักงาน --</option>}
              {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
            </select>
          </div>
          <div className="field" style={{flex:"1 1 140px"}}><label>วันที่</label>
            <input type="date" className="input tabular" value={advDate} onChange={e=>setAdvDate(e.target.value)}/>
          </div>
          <div className="field" style={{flex:"1 1 110px"}}><label>จำนวนเงิน</label>
            <input className="input tabular" type="number" min="0" step="50" value={advAmount} onChange={e=>setAdvAmount(e.target.value)}/>
          </div>
          <div className="field" style={{flex:"1 1 160px"}}><label>หมายเหตุ</label>
            <input className="input" value={advNote} onChange={e=>setAdvNote(e.target.value)} placeholder="ไม่บังคับ" onKeyDown={e=>{if(e.key==="Enter") submitAdvance();}}/>
          </div>
          <button className="btn btn-primary" disabled={!employees.length} onClick={submitAdvance}><Icon name="wallet" size={16}/>เบิกเงิน</button>
        </div>
      </div>

      <div className="panel">
        <div className="mode-toggle" style={{maxWidth:220}}>
          <button type="button" className={scope==="today"?"active":""} onClick={()=>setScope("today")}>วันนี้</button>
          <button type="button" className={scope==="all"?"active":""} onClick={()=>setScope("all")}>ทั้งหมด</button>
        </div>
      </div>

      <div className="data-table-wrap">
        {filteredAdvances.length===0 ? (
          <div className="empty-bill">ยังไม่มีรายการเบิกเงิน</div>
        ) : (
          <table className="data-table">
            <thead><tr><th>วันที่</th><th>พนักงาน</th><th>จำนวนเงิน</th><th>หมายเหตุ</th><th></th></tr></thead>
            <tbody>
              {filteredAdvances.map(a=>(
                <tr key={a.id}>
                  <td>
                    <input type="date" className="inline-input tabular" style={{maxWidth:130}}
                      value={a.date} onChange={ev=>onUpdateAdvance(a.id,{date:ev.target.value||a.date})}/>
                  </td>
                  <td style={{fontWeight:700}}>
                    {a.employeeName}
                    {!employees.some(e=>e.id===a.employeeId) && (
                      <div style={{fontSize:11,fontWeight:400,color:"var(--ink-faint)"}}>(ลบพนักงานนี้ออกจากระบบแล้ว)</div>
                    )}
                  </td>
                  <td>
                    <input className="inline-input tabular" type="number" min="0" step="50" style={{maxWidth:100,fontWeight:700,color:"var(--danger)"}}
                      value={a.amount} onChange={ev=>onUpdateAdvance(a.id,{amount:parseFloat(ev.target.value)||0})}/>
                  </td>
                  <td>
                    <input className="inline-input" style={{color:"var(--ink-muted)",fontSize:13}} value={a.note||""} placeholder="-"
                      onChange={ev=>onUpdateAdvance(a.id,{note:ev.target.value})}/>
                  </td>
                  <td>
                    <button className="icon-btn" title="ลบ" style={{color:"var(--danger)"}} onClick={()=>onDeleteAdvance(a.id)}>
                      <Icon name="trash" size={16}/>
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

/* ============================= SETTINGS PAGE ============================= */
const UI_SCALE_MIN = 0.8, UI_SCALE_MAX = 1.5, UI_SCALE_STEP = 0.1;

function SettingsPage({settings, onUpdateSettings, dataDir, theme, setTheme, uiScale, setUiScale, updateCheckStatus, onCheckForUpdates}){
  const [storeName,setStoreName] = useState(settings.storeName);
  const [saved,setSaved] = useState(false);
  const [appVer,setAppVer] = useState("");
  useEffect(()=>{ setStoreName(settings.storeName); },[settings.storeName]);
  useEffect(()=>{
    if(hasDesktop && window.scrapAPI.appVersion) window.scrapAPI.appVersion().then(setAppVer).catch(()=>{});
  },[]);

  function saveStoreName(){
    onUpdateSettings({storeName: storeName.trim() || DEFAULT_SETTINGS.storeName});
    setSaved(true);
    setTimeout(()=>setSaved(false), 1800);
  }

  const updateStatusText = (() => {
    if(!updateCheckStatus) return null;
    switch(updateCheckStatus.type){
      case "not-packaged": return "เช็คอัปเดตได้เฉพาะเวอร์ชันที่ติดตั้งจริงเท่านั้น (ไม่ใช่ตอนรันแบบพัฒนา)";
      case "checking": return "กำลังตรวจสอบอัปเดต...";
      case "available": return `พบอัปเดตใหม่เวอร์ชัน ${updateCheckStatus.version} — กำลังดาวน์โหลดเบื้องหลัง...`;
      case "not-available": return "ใช้เวอร์ชันล่าสุดอยู่แล้ว";
      case "downloaded": return `ดาวน์โหลดเวอร์ชัน ${updateCheckStatus.version} เสร็จแล้ว — ดูแถบด้านล่างเพื่อรีสตาร์ทติดตั้ง`;
      case "error": return `เช็คอัปเดตไม่สำเร็จ: ${updateCheckStatus.message||""}`;
      default: return null;
    }
  })();

  return (
    <>
      <div className="page-header">
        <div>
          <div className="page-title">ตั้งค่า</div>
          <div className="page-sub">ชื่อร้าน ตำแหน่งไฟล์ข้อมูล และการสำรองข้อมูลขึ้น Google Drive</div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-title"><Icon name="fileText" size={13}/>ชื่อร้าน (แสดงบนใบเสร็จ)</div>
        <div style={{display:"flex",gap:10,maxWidth:480,alignItems:"end",flexWrap:"wrap"}}>
          <div className="field" style={{flex:"1 1 260px"}}>
            <input className="input" value={storeName} onChange={e=>setStoreName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") saveStoreName();}}/>
          </div>
          <button className="btn btn-primary" onClick={saveStoreName}>
            <Icon name={saved?"check":"check"} size={16}/>{saved?"บันทึกแล้ว":"บันทึก"}
          </button>
        </div>
      </div>

      <div className="panel">
        <div className="panel-title"><Icon name="eye" size={13}/>การแสดงผล (เฉพาะหน้าจอนี้ — ไม่มีผลกับเครื่องอื่น)</div>
        <div className="field" style={{maxWidth:320}}>
          <label>ธีม</label>
          <div className="mode-toggle">
            <button type="button" className={theme==="system"?"active":""} onClick={()=>setTheme("system")}>ตามระบบ</button>
            <button type="button" className={theme==="light"?"active":""} onClick={()=>setTheme("light")}>สว่าง</button>
            <button type="button" className={theme==="dark"?"active":""} onClick={()=>setTheme("dark")}>มืด</button>
          </div>
        </div>
        <div className="field" style={{maxWidth:320,marginTop:14}}>
          <label>ขนาดตัวอักษร/หน้าจอทั้งหมด — เผื่อผู้สูงอายุอ่านง่ายขึ้น</label>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button type="button" className="btn" disabled={uiScale<=UI_SCALE_MIN}
              onClick={()=>setUiScale(Math.max(UI_SCALE_MIN, Math.round((uiScale-UI_SCALE_STEP)*10)/10))}>
              <Icon name="x" size={14}/>เล็กลง
            </button>
            <div className="tabular" style={{minWidth:52,textAlign:"center",fontWeight:700,fontSize:15}}>{Math.round(uiScale*100)}%</div>
            <button type="button" className="btn" disabled={uiScale>=UI_SCALE_MAX}
              onClick={()=>setUiScale(Math.min(UI_SCALE_MAX, Math.round((uiScale+UI_SCALE_STEP)*10)/10))}>
              <Icon name="plus" size={14}/>ใหญ่ขึ้น
            </button>
            {uiScale!==1 && (
              <button type="button" className="btn btn-ghost" onClick={()=>setUiScale(1)}>รีเซ็ต</button>
            )}
          </div>
        </div>
      </div>

      {hasDesktop && (
        <div className="panel">
          <div className="panel-title"><Icon name="refresh" size={13}/>อัปเดตโปรแกรม</div>
          <div style={{fontSize:13.5,color:"var(--ink-muted)"}}>
            เวอร์ชันปัจจุบัน: <span className="tabular" style={{color:"var(--ink)",fontWeight:700}}>{appVer||"..."}</span>
            {" "}— โปรแกรมเช็คอัปเดตให้อัตโนมัติอยู่แล้วตอนเปิดเครื่อง (และทุก 4 ชม.) กดปุ่มนี้เพื่อเช็คทันทีได้
          </div>
          <button className="btn btn-ghost btn-sm" style={{marginTop:8,alignSelf:"flex-start"}} onClick={onCheckForUpdates}>
            <Icon name="refresh" size={15}/>เช็คอัปเดตตอนนี้
          </button>
          {updateStatusText && (
            <div className="idcard-status muted" style={{marginTop:8}}>{updateStatusText}</div>
          )}
        </div>
      )}

      {hasDesktop && (
        <div className="panel">
          <div className="panel-title"><Icon name="hardDrive" size={13}/>ตำแหน่งไฟล์ข้อมูล</div>
          <div style={{fontSize:13.5,color:"var(--ink-muted)"}}>
            ไฟล์ข้อมูล (JSON) และไฟล์ Excel รวม (scrap-pos-data.xlsx) ที่ซิงก์อัตโนมัติ เก็บอยู่ที่:
          </div>
          <div className="idcard-box" style={{marginTop:8}}>
            <div className="tabular" style={{fontSize:13,wordBreak:"break-all"}}>{dataDir || "กำลังโหลด..."}</div>
          </div>
          <div style={{fontSize:13.5,color:"var(--ink-muted)",marginTop:10}}>
            รายงานยอดขายแยกรายเดือน (จัดกลุ่มตามวันที่ พร้อมยอดรวมย่อยรายวัน) อยู่ในโฟลเดอร์ย่อย "รายงานรายเดือน":
          </div>
          <button className="btn btn-ghost btn-sm" style={{marginTop:8,alignSelf:"flex-start"}}
            onClick={()=>window.scrapAPI.openMonthlyFolder()}>
            <Icon name="folder" size={15}/>เปิดโฟลเดอร์รายงานรายเดือน
          </button>
        </div>
      )}

      {hasDesktop && <DriveBackupCard/>}
      {!hasDesktop && (
        <div className="panel">
          <div className="idcard-status muted">การตั้งค่าสำรองข้อมูล Google Drive ทำได้จากคอมหลักเท่านั้น</div>
        </div>
      )}
    </>
  );
}

function DriveBackupCard(){
  const [status,setStatus] = useState(null);
  const [clientId,setClientId] = useState("");
  const [clientSecret,setClientSecret] = useState("");
  const [busy,setBusy] = useState(false);
  const [showSetup,setShowSetup] = useState(false);

  function refreshStatus(){
    window.scrapAPI.driveStatus().then(setStatus).catch(()=>{});
  }
  useEffect(()=>{ refreshStatus(); },[]);

  async function saveCreds(){
    if(!clientId.trim() || !clientSecret.trim()) return;
    setBusy(true);
    await window.scrapAPI.driveSetCredentials(clientId.trim(), clientSecret.trim());
    setBusy(false);
    setClientId(""); setClientSecret("");
    refreshStatus();
  }
  async function connect(){
    setBusy(true);
    const res = await window.scrapAPI.driveConnect();
    setBusy(false);
    refreshStatus();
    return res;
  }
  async function disconnect(){
    if(!window.confirm("ยกเลิกการเชื่อมต่อ Google Drive?")) return;
    await window.scrapAPI.driveDisconnect();
    refreshStatus();
  }
  async function backupNow(){
    setBusy(true);
    await window.scrapAPI.driveBackupNow();
    setBusy(false);
    refreshStatus();
  }

  if(!status) return (
    <div className="drive-card"><div className="idcard-status muted">กำลังโหลดสถานะ...</div></div>
  );

  return (
    <div className="drive-card">
      <div className="panel-title" style={{marginBottom:0}}><Icon name="cloud" size={14}/>สำรองข้อมูลขึ้น Google Drive</div>

      <div className="drive-status-row">
        <span className={"drive-dot "+(status.connected?"on":"")}/>
        <span style={{fontSize:14.5,fontWeight:600}}>
          {status.connected ? `เชื่อมต่อแล้ว — ${status.email}` : "ยังไม่ได้เชื่อมต่อ"}
        </span>
      </div>
      {status.lastBackupAt && (
        <div style={{fontSize:12.5,color:"var(--ink-muted)"}}>สำรองข้อมูลล่าสุด: {fmtDateTime(status.lastBackupAt)}</div>
      )}

      {!status.hasCredentials && (
        <>
          <div className="idcard-status muted">
            ต้องตั้งค่า Client ID / Client Secret จาก Google Cloud Console ก่อน (ทำครั้งเดียว)
          </div>
          <button className="btn btn-ghost btn-sm" style={{alignSelf:"flex-start"}} onClick={()=>setShowSetup(s=>!s)}>
            <Icon name="eye" size={14}/>{showSetup?"ซ่อนวิธีตั้งค่า":"ดูวิธีตั้งค่า"}
          </button>
          {showSetup && (
            <div className="setup-steps">
              1. เปิด <b>console.cloud.google.com</b> แล้วสร้างโปรเจกต์ใหม่ (หรือใช้โปรเจกต์เดิม)<br/>
              2. เมนู <b>APIs &amp; Services → Library</b> ค้นหา "Google Drive API" แล้วกด Enable<br/>
              3. เมนู <b>APIs &amp; Services → OAuth consent screen</b> เลือก External แล้วกรอกชื่อแอปพอผ่าน<br/>
              4. เมนู <b>APIs &amp; Services → Credentials → Create Credentials → OAuth client ID</b><br/>
              5. เลือกประเภท <b>Desktop app</b> ตั้งชื่ออะไรก็ได้ แล้วกด Create<br/>
              6. คัดลอก <b>Client ID</b> และ <b>Client Secret</b> มาใส่ในช่องด้านล่าง
            </div>
          )}
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <input className="input" style={{flex:"1 1 220px"}} placeholder="Client ID" value={clientId} onChange={e=>setClientId(e.target.value)}/>
            <input className="input" style={{flex:"1 1 220px"}} placeholder="Client Secret" type="password" value={clientSecret} onChange={e=>setClientSecret(e.target.value)}/>
            <button className="btn btn-primary" disabled={busy} onClick={saveCreds}>บันทึก</button>
          </div>
        </>
      )}

      {status.hasCredentials && !status.connected && (
        <button className="btn btn-primary" disabled={busy} onClick={connect}>
          <Icon name="cloud" size={16}/>{busy?"กำลังเชื่อมต่อ...":"เชื่อมต่อ Google Drive"}
        </button>
      )}

      {status.connected && (
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn-primary" disabled={busy} onClick={backupNow}>
            <Icon name="refresh" size={16}/>{busy?"กำลังสำรองข้อมูล...":"สำรองข้อมูลตอนนี้"}
          </button>
          <button className="btn btn-ghost" onClick={disconnect}><Icon name="unlink" size={15}/>ยกเลิกการเชื่อมต่อ</button>
        </div>
      )}
      <div style={{fontSize:11.5,color:"var(--ink-faint)"}}>
        สำรองข้อมูลอัตโนมัติทุก 15 นาทีเมื่อมีการเปลี่ยนแปลง และหลังบันทึกข้อมูลทุกครั้งจะรออัปโหลดภายใน 30 วินาที
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
